<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Uranus — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #1a2a3a 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #7dd3fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #7dd3fc, #38bdf8);
            color: #0a1a2a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.3);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(56, 189, 248, 0.3);
        }

        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">🚀 Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>⛢ Cari gambar target…</span>
        <button id="stopBtn">✕ Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // ─── DOM refs ───────────────────────────────────────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let planetGroup = null;
        let planetMesh = null;
        let ringGroup = null;
        let stars = null;

        // ─── Fit "contain" untuk video & canvas ───────────────────
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ─── Buat tekstur Uranus (procedural, detail) ─────────────
        function createUranusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // 1. Warna dasar biru kehijauan (cyan)
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#b0e0e6');  // powder blue
            grad.addColorStop(0.1, '#87ceeb');
            grad.addColorStop(0.2, '#7bb8d0');
            grad.addColorStop(0.3, '#6aa8c0');
            grad.addColorStop(0.4, '#7bb8d0');
            grad.addColorStop(0.5, '#87ceeb');
            grad.addColorStop(0.55, '#7bb8d0');
            grad.addColorStop(0.65, '#6aa8c0');
            grad.addColorStop(0.75, '#7bb8d0');
            grad.addColorStop(0.85, '#87ceeb');
            grad.addColorStop(0.9, '#7bb8d0');
            grad.addColorStop(1, '#b0e0e6');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Pita horizontal samar
            const bands = [
                { y: 0.05, height: 0.03, color: 'rgba(160,210,230,0.3)' },
                { y: 0.12, height: 0.05, color: 'rgba(140,200,220,0.2)' },
                { y: 0.20, height: 0.04, color: 'rgba(120,190,210,0.3)' },
                { y: 0.28, height: 0.06, color: 'rgba(150,205,225,0.2)' },
                { y: 0.38, height: 0.03, color: 'rgba(110,185,205,0.3)' },
                { y: 0.45, height: 0.08, color: 'rgba(145,200,220,0.2)' },
                { y: 0.55, height: 0.04, color: 'rgba(125,195,215,0.3)' },
                { y: 0.62, height: 0.05, color: 'rgba(155,210,230,0.2)' },
                { y: 0.72, height: 0.03, color: 'rgba(115,190,210,0.3)' },
                { y: 0.80, height: 0.07, color: 'rgba(135,200,220,0.2)' },
                { y: 0.90, height: 0.04, color: 'rgba(105,185,205,0.3)' },
            ];
            bands.forEach((b) => {
                const y0 = b.y * canvas.height;
                const h = b.height * canvas.height;
                ctx.fillStyle = b.color;
                ctx.fillRect(0, y0, canvas.width, h);
            });

            // 3. Efek kabut / awan tipis (swirl halus)
            ctx.strokeStyle = 'rgba(200,235,255,0.04)';
            ctx.lineWidth = 8;
            for (let i = 0; i < 25; i++) {
                const yBase = Math.random() * canvas.height;
                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += 3) {
                    const y = yBase + Math.sin(x * 0.008 + i * 0.7) * 20 + Math.sin(x * 0.015 + i * 1.1) * 10;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // 4. Beberapa area lebih terang (awan metana)
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = 30 + Math.random() * 60;
                const grad2 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad2.addColorStop(0, 'rgba(220, 245, 255, 0.15)');
                grad2.addColorStop(1, 'rgba(220, 245, 255, 0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // 5. Noise halus
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 8;
                data[i] += noise;
                data[i+1] += noise * 0.9;
                data[i+2] += noise * 0.7;
            }
            ctx.putImageData(imageData, 0, 0);

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            return tex;
        }

        // ─── Buat cincin Uranus (tipis) ────────────────────────────
        function createUranusRing() {
            const ringGroup = new THREE.Group();

            // Ring utama (cincin tipis)
            const innerRadius = 0.55;
            const outerRadius = 0.75;
            const segments = 64;
            const geometry = new THREE.RingGeometry(innerRadius, outerRadius, segments);

            // Tekstur cincin (gradasi transparan)
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
            grad.addColorStop(0, 'rgba(180, 200, 210, 0.0)');
            grad.addColorStop(0.1, 'rgba(180, 200, 210, 0.3)');
            grad.addColorStop(0.3, 'rgba(200, 220, 230, 0.6)');
            grad.addColorStop(0.5, 'rgba(220, 235, 240, 0.8)');
            grad.addColorStop(0.7, 'rgba(200, 220, 230, 0.6)');
            grad.addColorStop(0.9, 'rgba(180, 200, 210, 0.3)');
            grad.addColorStop(1, 'rgba(180, 200, 210, 0.0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.6,
                depthWrite: false,
            });
            const ring = new THREE.Mesh(geometry, material);
            ring.rotation.x = Math.PI / 2.2; // sedikit miring
            ring.rotation.z = 0.3;
            ringGroup.add(ring);

            // Cincin kedua lebih tipis dan jauh
            const innerRadius2 = 0.78;
            const outerRadius2 = 0.85;
            const geometry2 = new THREE.RingGeometry(innerRadius2, outerRadius2, segments);
            const material2 = new THREE.MeshBasicMaterial({
                color: 0x8899aa,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.2,
                depthWrite: false,
            });
            const ring2 = new THREE.Mesh(geometry2, material2);
            ring2.rotation.x = Math.PI / 2.2;
            ring2.rotation.z = 0.3;
            ringGroup.add(ring2);

            return ringGroup;
        }

        // ─── Start AR ──────────────────────────────────────────────
        async function startAR() {
            try {
                statusMsg.textContent = '⏳ Meminta izin kamera…';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/uranus.mind', // ← file target Uranus
                });

                const { renderer, scene, camera } = mindarThree;

                // ─── Pencahayaan ───────────────────────────────────
                const ambient = new THREE.AmbientLight(0x404060, 0.5);
                scene.add(ambient);

                const hemiLight = new THREE.HemisphereLight(0xaaccff, 0x224466, 0.7);
                scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
                dirLight.position.set(2, 3, 2);
                scene.add(dirLight);

                const fillLight = new THREE.DirectionalLight(0x88aadd, 0.4);
                fillLight.position.set(-2, 0.5, -1);
                scene.add(fillLight);

                // ─── Anchor target ─────────────────────────────────
                const anchor = mindarThree.addAnchor(0);

                // ─── Buat Uranus ───────────────────────────────────
                const planetRadius = 0.4;
                const texture = createUranusTexture();

                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.5,
                    metalness: 0.05,
                });

                const geometry = new THREE.SphereGeometry(planetRadius, 80, 80);
                planetMesh = new THREE.Mesh(geometry, material);

                // Kemiringan sumbu Uranus ~98°
                planetGroup = new THREE.Group();
                planetGroup.rotation.x = 1.7; // ~98° dalam radian
                planetGroup.rotation.z = 0.2;
                planetGroup.add(planetMesh);

                // ─── Atmosfer tipis (glow biru) ────────────────────
                const atmosMat = new THREE.MeshBasicMaterial({
                    color: 0x88ccff,
                    transparent: true,
                    opacity: 0.06,
                    side: THREE.BackSide,
                });
                const atmosGeo = new THREE.SphereGeometry(planetRadius * 1.04, 48, 48);
                const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
                planetGroup.add(atmosMesh);

                anchor.group.add(planetGroup);

                // ─── Cincin Uranus ──────────────────────────────────
                ringGroup = createUranusRing();
                // Sesuaikan posisi cincin agar mengikuti kemiringan planet
                ringGroup.rotation.x = 1.7;
                ringGroup.rotation.z = 0.2;
                anchor.group.add(ringGroup);

                // ─── Bintang-bintang latar ─────────────────────────
                const starGeo = new THREE.BufferGeometry();
                const starCount = 500;
                const starPos = new Float32Array(starCount * 3);
                const spread = 7.0;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.007,
                    transparent: true,
                    opacity: 0.7,
                    sizeAttenuation: true,
                });
                stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.2;
                anchor.group.add(stars);

                // ─── Tampilkan AR ──────────────────────────────────
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // ─── Animasi Loop ──────────────────────────────────
                renderer.setAnimationLoop(() => {
                    // Rotasi Uranus (lambat)
                    if (planetGroup) {
                        planetGroup.rotation.y += 0.002;
                    }
                    // Cincin ikut berotasi
                    if (ringGroup) {
                        ringGroup.rotation.y += 0.002;
                    }

                    // Bintang berputar pelan
                    if (stars) stars.rotation.y += 0.0001;

                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '✅ AR Uranus aktif!';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = '❌ Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ─── Stop AR ───────────────────────────────────────────────
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            planetGroup = null;
            planetMesh = null;
            ringGroup = null;
            stars = null;
        }

        // ─── Event listeners ──────────────────────────────────────
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
