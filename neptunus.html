<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Neptunus — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #0a1628 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(37, 99, 235, 0.15);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.3);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(37, 99, 235, 0.3);
        }

        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">🚀 Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>♆ Cari gambar target…</span>
        <button id="stopBtn">✕ Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // ─── DOM refs ───────────────────────────────────────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let planetGroup = null;
        let planetMesh = null;
        let stars = null;

        // ─── Fit "contain" untuk video & canvas ───────────────────
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ─── Texture loader ─────────────────────────────────────────
        const textureLoader = new THREE.TextureLoader();

        // ─── Buat tekstur Neptunus (procedural) sebagai fallback ───
        function createNeptuneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Warna dasar biru tua
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#4a7db5');
            grad.addColorStop(0.2, '#3a6a9e');
            grad.addColorStop(0.4, '#2a5a8a');
            grad.addColorStop(0.6, '#3a6a9e');
            grad.addColorStop(0.8, '#4a7db5');
            grad.addColorStop(1, '#2a5a8a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pita awan halus
            const bands = [
                { y: 0.1, h: 0.04, color: 'rgba(100, 160, 220, 0.3)' },
                { y: 0.25, h: 0.05, color: 'rgba(80, 140, 200, 0.25)' },
                { y: 0.40, h: 0.06, color: 'rgba(120, 180, 240, 0.2)' },
                { y: 0.55, h: 0.05, color: 'rgba(90, 150, 210, 0.25)' },
                { y: 0.70, h: 0.04, color: 'rgba(100, 160, 220, 0.3)' },
                { y: 0.85, h: 0.05, color: 'rgba(80, 140, 200, 0.25)' },
            ];

            bands.forEach((b) => {
                const yPos = b.y * canvas.height;
                const height = b.h * canvas.height;
                ctx.fillStyle = b.color;
                ctx.fillRect(0, yPos, canvas.width, height);
            });

            // Detail awan
            for (let i = 0; i < 400; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = Math.random() * 12 + 2;
                const alpha = Math.random() * 0.15 + 0.02;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(150, 200, 255, ${alpha})`;
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            return tex;
        }

        // ─── Load texture dari URL ────────────────────────────────
        function loadTextureFromURL(url) {
            return new Promise((resolve, reject) => {
                textureLoader.load(
                    url,
                    (tex) => {
                        tex.wrapS = THREE.RepeatWrapping;
                        tex.wrapT = THREE.RepeatWrapping;
                        tex.repeat.set(1, 1);
                        resolve(tex);
                    },
                    undefined,
                    (err) => reject(err)
                );
            });
        }

        // ─── Start AR ──────────────────────────────────────────────
        async function startAR() {
            try {
                statusMsg.textContent = '⏳ Meminta izin kamera…';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/neptunus.mind',
                });

                const { renderer, scene, camera } = mindarThree;

                // ─── Pencahayaan ───────────────────────────────────
                const ambient = new THREE.AmbientLight(0x404060, 0.6);
                scene.add(ambient);

                const hemiLight = new THREE.HemisphereLight(0x88ccff, 0x112233, 0.8);
                scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
                dirLight.position.set(2, 3, 2);
                scene.add(dirLight);

                const fillLight = new THREE.DirectionalLight(0x6688aa, 0.5);
                fillLight.position.set(-2, 0.5, -1);
                scene.add(fillLight);

                // ─── Anchor target ─────────────────────────────────
                const anchor = mindarThree.addAnchor(0);

                // ─── Buat Neptunus ─────────────────────────────────
                const planetRadius = 0.38;
                let texture;

                try {
                    statusMsg.textContent = '⏳ Memuat texture Neptunus…';
                    texture = await loadTextureFromURL(
                        'https://threejs.org/examples/textures/planets/neptune.jpg'
                    );
                    statusMsg.textContent = '✅ Texture Neptunus dimuat (PNG)';
                } catch (err) {
                    console.warn('Gagal memuat texture Neptunus, pakai procedural fallback:', err);
                    statusMsg.textContent = '⚠️ Gagal muat texture, pakai procedural.';
                    texture = createNeptuneTexture();
                }

                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.5,
                    metalness: 0.1,
                    emissive: new THREE.Color(0x112244),
                    emissiveIntensity: 0.1,
                });

                const geometry = new THREE.SphereGeometry(planetRadius, 64, 64);
                planetMesh = new THREE.Mesh(geometry, material);

                // ─── Planet dengan kemiringan sumbu ~28° ──────────
                planetGroup = new THREE.Group();
                planetGroup.rotation.x = 0.49; // ~28° dalam radian
                planetGroup.add(planetMesh);

                // ─── Atmosfer / glow ──────────────────────────────
                const atmosMat = new THREE.MeshBasicMaterial({
                    color: 0x4488ff,
                    transparent: true,
                    opacity: 0.08,
                    side: THREE.BackSide,
                });
                const atmosGeo = new THREE.SphereGeometry(planetRadius * 1.06, 48, 48);
                const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
                planetGroup.add(atmosMesh);

                // ─── Tambahkan efek "titik gelap" (Great Dark Spot) ──
                // Ini adalah fitur khas Neptunus, kita tambahkan sebagai decal sederhana
                // Karena tidak ada texture tambahan, kita buat dengan sphere kecil di permukaan
                const spotMat = new THREE.MeshBasicMaterial({
                    color: 0x1a2a4a,
                    transparent: true,
                    opacity: 0.3,
                });
                const spotGeo = new THREE.SphereGeometry(planetRadius * 0.12, 16, 16);
                const spot = new THREE.Mesh(spotGeo, spotMat);
                spot.position.set(planetRadius * 0.7, planetRadius * 0.3, planetRadius * 0.4);
                planetGroup.add(spot);

                // Tambahkan ke anchor
                anchor.group.add(planetGroup);

                // ─── Bintang-bintang latar ─────────────────────────
                const starGeo = new THREE.BufferGeometry();
                const starCount = 500;
                const starPos = new Float32Array(starCount * 3);
                const spread = 7.0;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.008,
                    transparent: true,
                    opacity: 0.7,
                    sizeAttenuation: true,
                });
                stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.2;
                anchor.group.add(stars);

                // ─── Tampilkan AR ──────────────────────────────────
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // ─── Animasi Loop ──────────────────────────────────
                renderer.setAnimationLoop(() => {
                    if (planetGroup) {
                        planetGroup.rotation.y += 0.004;
                    }
                    if (stars) stars.rotation.y += 0.0001;
                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '✅ AR Neptunus aktif!';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = '❌ Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ─── Stop AR ───────────────────────────────────────────────
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            planetGroup = null;
            planetMesh = null;
            stars = null;
        }

        // ─── Event listeners ──────────────────────────────────────
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
