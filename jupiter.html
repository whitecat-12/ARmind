<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Jupiter — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #1a1a24 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(245, 158, 11, 0.15);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #1a1a1a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.3);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(245, 158, 11, 0.3);
        }

        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>Cari gambar target...</span>
        <button id="stopBtn">Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // DOM refs
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let planetGroup = null;
        let planetMesh = null;
        let stars = null;

        // Fit "contain" untuk video & canvas
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // Texture loader
        const textureLoader = new THREE.TextureLoader();

        // Buat tekstur Jupiter (procedural)
        function createJupiterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#c8a88a');
            grad.addColorStop(0.12, '#e0c8b0');
            grad.addColorStop(0.25, '#d4b8a0');
            grad.addColorStop(0.38, '#c0a088');
            grad.addColorStop(0.50, '#dcc4ac');
            grad.addColorStop(0.62, '#b89878');
            grad.addColorStop(0.75, '#d0b098');
            grad.addColorStop(0.88, '#c8a888');
            grad.addColorStop(1, '#b09070');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const bands = [
                { y: 0.02, h: 0.06, color: 'rgba(180,140,110,0.7)' },
                { y: 0.10, h: 0.04, color: 'rgba(230,210,190,0.4)' },
                { y: 0.16, h: 0.08, color: 'rgba(160,120,90,0.6)' },
                { y: 0.26, h: 0.05, color: 'rgba(240,220,200,0.3)' },
                { y: 0.33, h: 0.10, color: 'rgba(140,100,70,0.7)' },
                { y: 0.45, h: 0.06, color: 'rgba(250,235,215,0.25)' },
                { y: 0.53, h: 0.12, color: 'rgba(130,90,60,0.65)' },
                { y: 0.67, h: 0.05, color: 'rgba(245,225,205,0.3)' },
                { y: 0.74, h: 0.08, color: 'rgba(170,130,100,0.6)' },
                { y: 0.84, h: 0.04, color: 'rgba(235,215,195,0.35)' },
                { y: 0.90, h: 0.07, color: 'rgba(155,115,85,0.6)' },
                { y: 0.98, h: 0.04, color: 'rgba(210,190,170,0.3)' },
            ];

            bands.forEach((b) => {
                const yPos = b.y * canvas.height;
                const height = b.h * canvas.height;
                ctx.fillStyle = b.color;
                ctx.fillRect(0, yPos, canvas.width, height);
            });

            for (let i = 0; i < 3000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = Math.random() * 15 + 2;
                const alpha = Math.random() * 0.15 + 0.02;
                const hue = 30 + Math.random() * 25;
                const lightness = 50 + Math.random() * 30;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 60%, ${lightness}%, ${alpha})`;
                ctx.fill();
            }

            // Great Red Spot
            const spotX = canvas.width * 0.62;
            const spotY = canvas.height * 0.54;
            const spotRadius = canvas.width * 0.085;

            const spotGrad = ctx.createRadialGradient(
                spotX - spotRadius * 0.1, spotY - spotRadius * 0.1, 0,
                spotX, spotY, spotRadius
            );
            spotGrad.addColorStop(0, '#e05030');
            spotGrad.addColorStop(0.35, '#d84830');
            spotGrad.addColorStop(0.55, '#c84028');
            spotGrad.addColorStop(0.75, '#aa3020');
            spotGrad.addColorStop(1, '#6a1a10');

            ctx.fillStyle = spotGrad;
            ctx.beginPath();
            ctx.ellipse(spotX, spotY, spotRadius, spotRadius * 0.75, 0.1, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * spotRadius * 0.55;
                const x = spotX + Math.cos(angle) * dist;
                const y = spotY + Math.sin(angle) * dist * 0.75;
                const r = Math.random() * 5 + 2;
                const alpha = Math.random() * 0.25 + 0.05;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(160, 50, 25, ${alpha})`;
                ctx.fill();
            }

            const storms = [
                { x: 0.2, y: 0.3, w: 0.04, h: 0.025, color: '#d4a080' },
                { x: 0.35, y: 0.7, w: 0.05, h: 0.03, color: '#c89070' },
                { x: 0.8, y: 0.45, w: 0.035, h: 0.02, color: '#d0a888' },
                { x: 0.15, y: 0.65, w: 0.03, h: 0.02, color: '#c09878' },
                { x: 0.9, y: 0.25, w: 0.04, h: 0.025, color: '#d4a888' },
            ];
            storms.forEach((s) => {
                const x = s.x * canvas.width;
                const y = s.y * canvas.height;
                const w = s.w * canvas.width;
                const h = s.h * canvas.height;
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(180,130,100,0.3)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // Load texture dari URL dengan fallback
        function loadTextureFromURL(urls) {
            return new Promise((resolve, reject) => {
                let index = 0;
                function tryNext() {
                    if (index >= urls.length) {
                        reject(new Error('Semua URL gagal dimuat'));
                        return;
                    }
                    const url = urls[index];
                    textureLoader.load(
                        url,
                        (tex) => {
                            tex.wrapS = THREE.RepeatWrapping;
                            tex.wrapT = THREE.RepeatWrapping;
                            tex.repeat.set(1, 1);
                            tex.colorSpace = THREE.SRGBColorSpace;
                            resolve(tex);
                        },
                        undefined,
                        () => {
                            index++;
                            tryNext();
                        }
                    );
                }
                tryNext();
            });
        }

        // Start AR
        async function startAR() {
            try {
                statusMsg.textContent = 'Meminta izin kamera...';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/jupiter.mind',
                });

                const { renderer, scene, camera } = mindarThree;

                // Pencahayaan
                const ambient = new THREE.AmbientLight(0x443322, 0.5);
                scene.add(ambient);

                const hemiLight = new THREE.HemisphereLight(0xffdd88, 0x332211, 0.8);
                scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffeedd, 1.8);
                dirLight.position.set(2, 3, 2);
                scene.add(dirLight);

                const fillLight = new THREE.DirectionalLight(0xffaa66, 0.4);
                fillLight.position.set(-2, 0.5, -1);
                scene.add(fillLight);

                // Anchor target
                const anchor = mindarThree.addAnchor(0);

                // Buat Jupiter
                const planetRadius = 0.5;
                let texture;

                try {
                    statusMsg.textContent = 'Memuat texture Jupiter...';
                    texture = await loadTextureFromURL([
                        'https://threejs.org/examples/textures/planets/jupiter.jpg',
                        'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/jupiter.jpg',
                    ]);
                    statusMsg.textContent = 'Texture Jupiter dimuat (PNG)';
                } catch (err) {
                    console.warn('Gagal memuat texture Jupiter, pakai procedural fallback:', err);
                    statusMsg.textContent = 'Gagal muat texture, pakai procedural.';
                    texture = createJupiterTexture();
                }

                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.6,
                    metalness: 0.05,
                    emissive: new THREE.Color(0x442200),
                    emissiveIntensity: 0.08,
                });

                const geometry = new THREE.SphereGeometry(planetRadius, 80, 80);
                planetMesh = new THREE.Mesh(geometry, material);
                planetGroup = new THREE.Group();
                planetGroup.add(planetMesh);

                // Atmosfer / glow
                const atmosMat = new THREE.MeshBasicMaterial({
                    color: 0xffaa44,
                    transparent: true,
                    opacity: 0.08,
                    side: THREE.BackSide,
                });
                const atmosGeo = new THREE.SphereGeometry(planetRadius * 1.08, 48, 48);
                const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
                planetGroup.add(atmosMesh);

                anchor.group.add(planetGroup);

                // Bintang-bintang latar
                const starGeo = new THREE.BufferGeometry();
                const starCount = 500;
                const starPos = new Float32Array(starCount * 3);
                const spread = 7.0;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.008,
                    transparent: true,
                    opacity: 0.7,
                    sizeAttenuation: true,
                });
                stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.2;
                anchor.group.add(stars);

                // Tampilkan AR
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // Animasi Loop
                renderer.setAnimationLoop(() => {
                    if (planetGroup) {
                        planetGroup.rotation.y += 0.006;
                    }
                    if (stars) stars.rotation.y += 0.0001;
                    renderer.render(scene, camera);
                });

                statusMsg.textContent = 'AR Jupiter aktif.';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // Stop AR
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            planetGroup = null;
            planetMesh = null;
            stars = null;
        }

        // Event listeners
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
