<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Bumi</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- MindAR (harus dimuat SETELAH A-Frame) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* Sembunyikan UI loading bawaan MindAR yang kadang menutupi layar */
        .mindar-ui-overlay {
            display: none !important;
        }
    </style>
</head>
<body>
<a-scene
    mindar-image="imageTargetSrc: ./targets/bumi.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
        <a-asset-item id="bumiModel" src="./models/bumi.glb"></a-asset-item>
    </a-assets>

    <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        cursor="fuse: false; rayOrigin: mouse;"
        raycaster="far: 10000; objects: .clickable">
    </a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-gltf-model
            id="bumiEntity"
            src="#bumiModel"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.3 0.3 0.3"
            class="clickable">
        </a-gltf-model>
    </a-entity>

</a-scene>

<script>
    const sceneEl = document.querySelector('a-scene');

    sceneEl.addEventListener('renderstart', () => {
        console.log('AR scene siap.');
    });

    document.querySelector('#target').addEventListener('targetFound', () => {
        console.log('Target ditemukan');
    });

    document.querySelector('#target').addEventListener('targetLost', () => {
        console.log('Target hilang');
    });

    document.querySelector('#bumiEntity').addEventListener('model-error', (e) => {
        console.error('Gagal load model glb:', e.detail);
    });

    // Cek langsung file glb via fetch, biar tahu status & ukuran sebenarnya
    fetch('./models/bumi.glb')
        .then(res => {
            console.log('Status fetch bumi.glb:', res.status, res.statusText);
            console.log('Content-Length:', res.headers.get('content-length'));
            console.log('Content-Type:', res.headers.get('content-type'));
            return res.arrayBuffer();
        })
        .then(buf => {
            console.log('Ukuran file yang benar-benar diterima browser:', buf.byteLength, 'bytes');
            const view = new Uint8Array(buf.slice(0, 4));
            const magic = String.fromCharCode(...view);
            console.log('Magic bytes:', magic, '(harus "glTF")');
        })
        .catch(err => console.error('Fetch gagal total:', err));
</script>
</body>
</html>
