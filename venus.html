<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Venus — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #1a1a24 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.15);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #1a1a1a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.3);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(251, 191, 36, 0.3);
        }

        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">🚀 Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>♀️ Cari gambar target…</span>
        <button id="stopBtn">✕ Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // ─── DOM refs ───────────────────────────────────────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let planetGroup = null;
        let planetMesh = null;
        let cloudMesh = null;
        let stars = null;

        // ─── Fit "contain" untuk video & canvas ───────────────────
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ─── Buat tekstur Venus (procedural) ──────────────────────
        function createVenusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // 1. Warna dasar kuning-oranye
            const grad = ctx.createRadialGradient(512, 512, 0, 512, 512, 512);
            grad.addColorStop(0, '#fde68a');
            grad.addColorStop(0.3, '#fbbf24');
            grad.addColorStop(0.6, '#f59e0b');
            grad.addColorStop(0.85, '#d97706');
            grad.addColorStop(1, '#92400e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            // 2. Pola awan / swirl
            for (let i = 0; i < 600; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 40 + 10;
                const alpha = Math.random() * 0.15 + 0.05;
                const brightness = 150 + Math.random() * 100;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${brightness}, ${brightness-40}, ${brightness-80}, ${alpha})`;
                ctx.fill();
            }

            // 3. Garis-garis awan melengkung
            ctx.strokeStyle = 'rgba(255, 220, 150, 0.08)';
            ctx.lineWidth = 4;
            for (let i = 0; i < 120; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const len = Math.random() * 150 + 50;
                const angle = Math.random() * Math.PI * 2;
                const curve = (Math.random() - 0.5) * 0.5;
                ctx.beginPath();
                ctx.moveTo(x, y);
                let steps = 20;
                for (let j = 0; j <= steps; j++) {
                    const t = j / steps;
                    const px = x + Math.cos(angle) * len * t + Math.sin(angle * 0.5) * curve * len * t * 30;
                    const py = y + Math.sin(angle) * len * t + Math.cos(angle * 0.5) * curve * len * t * 30;
                    ctx.lineTo(px, py);
                }
                ctx.stroke();
            }

            // 4. Bintik-bintik terang (awan tebal)
            for (let i = 0; i < 800; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 12 + 2;
                const alpha = Math.random() * 0.2 + 0.05;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 200, ${alpha})`;
                ctx.fill();
            }

            // 5. Beberapa area gelap (badai)
            for (let i = 0; i < 40; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 30 + 10;
                const grad2 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad2.addColorStop(0, 'rgba(80, 40, 10, 0.2)');
                grad2.addColorStop(1, 'rgba(80, 40, 10, 0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            return tex;
        }

        // ─── Buat tekstur awan (transparan) ──────────────────────
        function createCloudTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Dasar transparan
            ctx.clearRect(0, 0, 512, 512);

            // Awan-awan putih transparan
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const r = Math.random() * 30 + 10;
                const alpha = Math.random() * 0.15 + 0.02;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 2})`);
                grad.addColorStop(1, `rgba(255, 255, 255, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // ─── Start AR ──────────────────────────────────────────────
        async function startAR() {
            try {
                statusMsg.textContent = '⏳ Meminta izin kamera…';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/venus.mind', // ← file target Venus
                });

                const { renderer, scene, camera } = mindarThree;

                // ─── Pencahayaan ───────────────────────────────────
                const ambient = new THREE.AmbientLight(0x404060, 0.6);
                scene.add(ambient);

                const hemiLight = new THREE.HemisphereLight(0xffdd88, 0x222244, 0.8);
                scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
                dirLight.position.set(2, 3, 2);
                scene.add(dirLight);

                const fillLight = new THREE.DirectionalLight(0xccaa88, 0.5);
                fillLight.position.set(-2, 0.5, -1);
                scene.add(fillLight);

                // ─── Anchor target ─────────────────────────────────
                const anchor = mindarThree.addAnchor(0);

                // ─── Buat Venus ────────────────────────────────────
                const planetRadius = 0.35;
                const texture = createVenusTexture();

                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.7,
                    metalness: 0.0,
                    emissive: new THREE.Color(0x442200),
                    emissiveIntensity: 0.1,
                });

                const geometry = new THREE.SphereGeometry(planetRadius, 64, 64);
                planetMesh = new THREE.Mesh(geometry, material);
                planetGroup = new THREE.Group();
                planetGroup.add(planetMesh);

                // ─── Lapisan awan (transparan, berputar terpisah) ──
                const cloudTex = createCloudTexture();
                const cloudMat = new THREE.MeshStandardMaterial({
                    map: cloudTex,
                    transparent: true,
                    opacity: 0.4,
                    roughness: 1.0,
                    metalness: 0.0,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                });
                const cloudGeo = new THREE.SphereGeometry(planetRadius * 1.02, 48, 48);
                cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
                planetGroup.add(cloudMesh);

                // ─── Atmosfer glow ─────────────────────────────────
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0xffaa44,
                    transparent: true,
                    opacity: 0.08,
                    side: THREE.BackSide,
                });
                const glowGeo = new THREE.SphereGeometry(planetRadius * 1.15, 48, 48);
                const glowMesh = new THREE.Mesh(glowGeo, glowMat);
                planetGroup.add(glowMesh);

                anchor.group.add(planetGroup);

                // ─── Bintang-bintang latar ─────────────────────────
                const starGeo = new THREE.BufferGeometry();
                const starCount = 400;
                const starPos = new Float32Array(starCount * 3);
                const spread = 6.0;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.008,
                    transparent: true,
                    opacity: 0.7,
                    sizeAttenuation: true,
                });
                stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.2;
                anchor.group.add(stars);

                // ─── Tampilkan AR ──────────────────────────────────
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // ─── Animasi Loop ──────────────────────────────────
                renderer.setAnimationLoop(() => {
                    // Rotasi planet
                    if (planetGroup) {
                        planetGroup.rotation.y += 0.002;
                    }
                    // Awan berputar sedikit lebih cepat
                    if (cloudMesh) {
                        cloudMesh.rotation.y += 0.004;
                    }

                    // Bintang berputar pelan
                    if (stars) stars.rotation.y += 0.0001;

                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '✅ AR Venus aktif!';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = '❌ Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ─── Stop AR ───────────────────────────────────────────────
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            planetGroup = null;
            planetMesh = null;
            cloudMesh = null;
            stars = null;
        }

        // ─── Event listeners ──────────────────────────────────────
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
