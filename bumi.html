<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Bumi & Bulan — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        /* OVERLAY — hanya menampilkan "Start the adventure" dan tombol */
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #0f2027 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #22d3ee, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(34, 211, 238, 0.15);
        }
        /* tombol tetap sama */
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #22d3ee, #0891b2);
            color: #06222a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.4);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(34, 211, 238, 0.3);
        }

        /* status message tetap ada tapi tersembunyi (digunakan untuk log) */
        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0; /* disembunyikan secara visual */
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- OVERLAY: hanya judul & tombol -->
    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">🚀 Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>🌍 Cari gambar target…</span>
        <button id="stopBtn">✕ Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ─── DOM refs ───────────────────────────────────────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let earthGroup = null;
        let orbitGroup = null;
        let gltfScene = null;

        // ─── Fit "contain" untuk video & canvas ───────────────────
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ─── Texture loader untuk Bulan ────────────────────────────
        const textureLoader = new THREE.TextureLoader();

        function loadTextureWithFallback(url, fallbackColor) {
            return new Promise((resolve) => {
                textureLoader.load(
                    url,
                    (tex) => resolve(tex),
                    undefined,
                    () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 64;
                        canvas.height = 64;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = fallbackColor || '#888';
                        ctx.fillRect(0, 0, 64, 64);
                        const fallbackTex = new THREE.CanvasTexture(canvas);
                        resolve(fallbackTex);
                    }
                );
            });
        }

        // ─── Buat tekstur Bulan prosedural ─────────────────────────
        function createMoonTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 128);
            grad.addColorStop(0, '#d0d0d0');
            grad.addColorStop(0.6, '#b0b0b0');
            grad.addColorStop(1, '#888888');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            const craters = [
                { x: 70, y: 60, r: 18 },
                { x: 160, y: 80, r: 14 },
                { x: 100, y: 150, r: 22 },
                { x: 190, y: 170, r: 10 },
                { x: 50, y: 180, r: 12 },
                { x: 140, y: 210, r: 8 },
                { x: 210, y: 50, r: 16 },
                { x: 30, y: 120, r: 9 },
                { x: 180, y: 130, r: 13 },
                { x: 110, y: 40, r: 11 },
            ];
            craters.forEach((c) => {
                const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
                g.addColorStop(0, 'rgba(70,70,70,0.5)');
                g.addColorStop(0.5, 'rgba(50,50,50,0.4)');
                g.addColorStop(1, 'rgba(30,30,30,0.2)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(200,200,200,0.15)';
                ctx.beginPath();
                ctx.arc(c.x - c.r * 0.25, c.y - c.r * 0.25, c.r * 0.3, 0, Math.PI * 2);
                ctx.fill();
            });

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            return tex;
        }

        // ─── Start AR ──────────────────────────────────────────────
        async function startAR() {
            try {
                statusMsg.textContent = '⏳ Meminta izin kamera…';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/bumi.mind',
                });

                const { renderer, scene, camera } = mindarThree;

                // ─── Pencahayaan ───────────────────────────────────
                const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a3a3a, 1.4);
                scene.add(hemiLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
                dirLight.position.set(1, 2, 1);
                scene.add(dirLight);
                const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4);
                fillLight.position.set(-0.8, 0.6, -0.5);
                scene.add(fillLight);

                // ─── Anchor target ─────────────────────────────────
                const anchor = mindarThree.addAnchor(0);

                // ─── Load GLB Bumi ─────────────────────────────────
                statusMsg.textContent = '⏳ Memuat model Bumi…';
                const loader = new GLTFLoader();

                try {
                    const glb = await new Promise((resolve, reject) => {
                        loader.load(
                            'models/bumi.glb',
                            (gltf) => resolve(gltf),
                            undefined,
                            (err) => reject(err)
                        );
                    });

                    gltfScene = glb.scene;
                    const box = new THREE.Box3().setFromObject(gltfScene);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const targetScale = maxDim > 0 ? 0.8 / maxDim : 1;
                    gltfScene.scale.set(targetScale, targetScale, targetScale);
                    gltfScene.position.set(0, 0, 0);

                    earthGroup = new THREE.Group();
                    earthGroup.rotation.x = 0.41;
                    earthGroup.add(gltfScene);
                    anchor.group.add(earthGroup);

                    statusMsg.textContent = '✅ Model Bumi dimuat.';
                } catch (err) {
                    console.warn('Gagal load bumi.glb, pakai sphere fallback:', err);
                    statusMsg.textContent = '⚠️ Model GLB gagal, pakai fallback.';

                    const fallbackTex = await loadTextureWithFallback(
                        'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
                        '#2d7d9a'
                    );
                    const earthRadius = 0.35;
                    const earthGeo = new THREE.SphereGeometry(earthRadius, 64, 64);
                    const earthMat = new THREE.MeshStandardMaterial({
                        map: fallbackTex,
                        roughness: 0.5,
                        metalness: 0.05,
                    });
                    const fallbackMesh = new THREE.Mesh(earthGeo, earthMat);
                    earthGroup = new THREE.Group();
                    earthGroup.rotation.x = 0.41;
                    earthGroup.add(fallbackMesh);
                    anchor.group.add(earthGroup);

                    const glowGeo = new THREE.SphereGeometry(earthRadius * 1.07, 48, 48);
                    const glowMat = new THREE.MeshBasicMaterial({
                        color: 0x4da6ff,
                        transparent: true,
                        opacity: 0.13,
                        side: THREE.BackSide,
                    });
                    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
                    earthGroup.add(glowMesh);
                }

                // ─── Bulan ──────────────────────────────────────────
                const moonTex = createMoonTexture();
                const moonGeo = new THREE.SphereGeometry(0.055, 32, 32);
                const moonMat = new THREE.MeshStandardMaterial({
                    map: moonTex,
                    roughness: 0.9,
                    metalness: 0.0,
                });
                const moonMesh = new THREE.Mesh(moonGeo, moonMat);
                moonMesh.position.set(0.55, 0, 0);

                orbitGroup = new THREE.Group();
                orbitGroup.rotation.x = 0.09;
                orbitGroup.rotation.z = 0.04;
                orbitGroup.add(moonMesh);
                anchor.group.add(orbitGroup);

                // ─── Bintang ────────────────────────────────────────
                const starGeo = new THREE.BufferGeometry();
                const starCount = 200;
                const starPos = new Float32Array(starCount * 3);
                const spread = 3.2;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.006,
                    transparent: true,
                    opacity: 0.6,
                    sizeAttenuation: true,
                });
                const stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.15;
                anchor.group.add(stars);

                // ─── Tampilkan AR ──────────────────────────────────
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                renderer.setAnimationLoop(() => {
                    if (earthGroup) {
                        if (gltfScene) {
                            gltfScene.rotation.y += 0.004;
                        } else {
                            earthGroup.children.forEach(child => {
                                if (child.isMesh) child.rotation.y += 0.004;
                            });
                        }
                    }
                    if (orbitGroup) orbitGroup.rotation.y += 0.012;
                    stars.rotation.y += 0.0004;
                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '✅ AR aktif!';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = '❌ Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ─── Stop AR ───────────────────────────────────────────────
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            earthGroup = null;
            orbitGroup = null;
            gltfScene = null;
        }

        // ─── Event listeners ──────────────────────────────────────
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
