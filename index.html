<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Bumi - MindAR + Three.js</title>
    <style>
        /* Reset & fullscreen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a1a;
            font-family: Arial, sans-serif;
        }
        #ar-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Loading overlay */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 30, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            transition: opacity 0.8s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        #loading p {
            margin-top: 20px;
            font-size: 18px;
            letter-spacing: 1px;
            color: #b0bec5;
        }
        #loading .hint {
            font-size: 14px;
            color: #78909c;
            margin-top: 8px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Info / tombol kecil */
        #controls {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            pointer-events: none;
        }
        #controls button {
            pointer-events: auto;
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }
        #controls button:active {
            transform: scale(0.95);
        }
        #controls button .icon {
            margin-right: 6px;
        }

        /* Status tracking kecil */
        #tracking-status {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #tracking-status.visible {
            opacity: 1;
        }
        #tracking-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        #tracking-status .dot.found {
            background: #4caf50;
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.6);
        }
        #tracking-status .dot.lost {
            background: #f44336;
            box-shadow: 0 0 12px rgba(244, 67, 54, 0.4);
        }
        #tracking-status .dot.searching {
            background: #ff9800;
            animation: pulse-dot 1s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.6);
            }
        }

        /* Responsif */
        @media (max-width: 480px) {
            #controls button {
                padding: 8px 16px;
                font-size: 12px;
            }
            #loading p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <p>⏳ Memulai AR Bumi...</p>
        <span class="hint">Pastikan kamera diizinkan &amp; gambar target terlihat</span>
    </div>

    <!-- Status tracking -->
    <div id="tracking-status">
        <span class="dot searching" id="statusDot"></span>
        <span id="statusText">Mencari target...</span>
    </div>

    <!-- Container AR -->
    <div id="ar-container"></div>

    <!-- Kontrol -->
    <div id="controls">
        <button id="btn-start">▶ Mulai AR</button>
        <button id="btn-stop">⏹ Stop</button>
        <button id="btn-reset">↻ Reset</button>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Import Map untuk Three.js & add-ons                      -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!--  Modul utama                                              -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <script type="module">
        // ─── Impor ────────────────────────────────────────────────
        import * as THREE from 'three';
        // MindARThree dari CDN (versi 1.2.0 stabil)
        import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mindar-js-three@1.2.0/dist/mindar-js-three.module.js';

        // ─── DOM refs ─────────────────────────────────────────────
        const container = document.getElementById('ar-container');
        const loadingEl = document.getElementById('loading');
        const statusEl = document.getElementById('tracking-status');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnReset = document.getElementById('btn-reset');

        // ─── State ────────────────────────────────────────────────
        let mindarThree = null;
        let earthMesh = null;
        let anchorGroup = null;
        let isRunning = false;
        let animationId = null;
        let earthTexture = null;

        // ─── Helper: status UI ────────────────────────────────────
        function setStatus(mode, text) {
            statusEl.classList.add('visible');
            statusDot.className = 'dot ' + mode;
            statusText.textContent = text;
        }

        function hideStatus() {
            statusEl.classList.remove('visible');
        }

        // ─── Buat Bumi ────────────────────────────────────────────
        function createEarth() {
            // Geometri bola dengan detail tinggi
            const geo = new THREE.SphereGeometry(1, 80, 80);

            // Texture Bumi dari three.js contoh (gratis)
            const loader = new THREE.TextureLoader();
            const texUrl = 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg';
            earthTexture = loader.load(texUrl);

            // Material
            const mat = new THREE.MeshPhongMaterial({
                map: earthTexture,
                specular: new THREE.Color(0x333333),
                shininess: 25,
                emissive: new THREE.Color(0x000022),
                emissiveIntensity: 0.05,
            });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Tambahkan awan tipis sebagai lapisan kedua (opsional)
            const cloudGeo = new THREE.SphereGeometry(1.008, 80, 80);
            const cloudTex = loader.load(
                'https://threejs.org/examples/textures/planets/earth_clouds_1024.png'
            );
            const cloudMat = new THREE.MeshPhongMaterial({
                map: cloudTex,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });
            const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
            mesh.add(cloudMesh); // awan mengikuti Bumi

            return mesh;
        }

        // ─── Inisialisasi MindAR ──────────────────────────────────
        async function initMindAR() {
            if (mindarThree) {
                // Hentikan instance lama
                try { await mindarThree.stop(); } catch (_) {}
                mindarThree = null;
            }

            // Buat instance MindARThree
            mindarThree = new MindARThree({
                container: container,
                imageTargetSrc: 'bumi.mind', // file target yang sudah disiapkan user
                maxTrack: 1,
                // UI / log tidak terlalu berisik
                uiLoading: 'no',
                uiScanning: 'no',
            });

            // ── Dapatkan scene, camera, renderer ──
            const { scene, camera, renderer } = mindarThree;

            // ── Setup pencahayaan ──
            // Ambient light
            const ambient = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambient);

            // Directional light utama (seperti matahari)
            const sunLight = new THREE.DirectionalLight(0xffeedd, 2.0);
            sunLight.position.set(5, 3, 5);
            sunLight.castShadow = false;
            scene.add(sunLight);

            // Light dari samping
            const fillLight = new THREE.DirectionalLight(0x4488ff, 0.6);
            fillLight.position.set(-3, 1, -4);
            scene.add(fillLight);

            // Light belakang
            const backLight = new THREE.DirectionalLight(0x88aaff, 0.3);
            backLight.position.set(-2, -1, -6);
            scene.add(backLight);

            // ── Buat Bumi ──
            earthMesh = createEarth();

            // ── Tambahkan ke anchor (target image) ──
            // anchor index 0 = target pertama dalam .mind file
            anchorGroup = mindarThree.addAnchor(0);
            anchorGroup.group.add(earthMesh);

            // Bumi sedikit lebih kecil agar pas dengan target
            earthMesh.scale.set(0.8, 0.8, 0.8);

            // ── Event tracking ──
            mindarThree.onTargetFound = () => {
                setStatus('found', '✅ Target ditemukan! Bumi muncul');
                // Efek kecil: animasi scale saat muncul
                if (earthMesh) {
                    earthMesh.scale.set(0.01, 0.01, 0.01);
                    gsapToScale(earthMesh, 0.8, 600);
                }
            };

            mindarThree.onTargetLost = () => {
                setStatus('lost', '❌ Target hilang');
                if (earthMesh) {
                    // Sembunyikan dengan animasi
                    gsapToScale(earthMesh, 0.01, 400);
                }
            };

            // ── Render loop manual (kita kontrol sendiri) ──
            // Hentikan render loop bawaan mindar-three agar kita bisa
            // menambahkan animasi rotasi Bumi.
            // Kita override dengan requestAnimationFrame kita sendiri.
            // Tapi kita tetap pakai renderer dari mindarThree.

            // ── Mulai AR ──
            await mindarThree.start();
            isRunning = true;

            // Mulai loop render kita sendiri
            animate();

            // Sembunyikan loading
            loadingEl.classList.add('hidden');

            // Update status
            setStatus('searching', '🔍 Mencari target...');

            // Update tombol
            btnStart.disabled = true;
            btnStart.textContent = '▶ Berjalan';
        }

        // ─── Animasi scale sederhana (tanpa GSAP) ────────────────
        function gsapToScale(obj, targetScale, duration) {
            const start = obj.scale.x;
            const startTime = performance.now();

            function updateScale() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // easing easeOutCubic
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = start + (targetScale - start) * eased;
                obj.scale.set(current, current, current);
                if (progress < 1) {
                    requestAnimationFrame(updateScale);
                }
            }
            updateScale();
        }

        // ─── Animasi loop ──────────────────────────────────────────
        function animate() {
            if (!isRunning || !mindarThree) return;

            // Rotasi Bumi perlahan
            if (earthMesh) {
                earthMesh.rotation.y += 0.0025;
                // Awan berotasi sedikit lebih cepat
                if (earthMesh.children.length > 0) {
                    const cloud = earthMesh.children[0];
                    if (cloud && cloud.isMesh) {
                        cloud.rotation.y += 0.0035;
                    }
                }
            }

            // Render menggunakan renderer dari mindarThree
            if (mindarThree && mindarThree.renderer) {
                mindarThree.renderer.render(mindarThree.scene, mindarThree.camera);
            }

            animationId = requestAnimationFrame(animate);
        }

        // ─── Stop AR ──────────────────────────────────────────────
        async function stopAR() {
            if (!mindarThree || !isRunning) return;

            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            try {
                await mindarThree.stop();
            } catch (e) {
                console.warn('Stop error:', e);
            }

            // Reset UI
            btnStart.disabled = false;
            btnStart.textContent = '▶ Mulai AR';
            hideStatus();
            loadingEl.classList.remove('hidden');
            loadingEl.querySelector('p').textContent = '⏹ AR dihentikan';
            loadingEl.querySelector('.hint').textContent = 'Klik "Mulai AR" untuk memulai ulang';

            // Hapus Bumi dari scene agar tidak menggantung
            if (anchorGroup && earthMesh) {
                anchorGroup.group.remove(earthMesh);
                // dispose
                earthMesh.geometry.dispose();
                if (earthMesh.material.map) earthMesh.material.map = null;
                earthMesh.material.dispose();
                earthMesh = null;
                anchorGroup = null;
            }

            mindarThree = null;
        }

        // ─── Reset (stop lalu start ulang) ──────────────────────
        async function resetAR() {
            await stopAR();
            // Tunggu sebentar lalu start ulang
            setTimeout(() => {
                loadingEl.querySelector('p').textContent = '🔄 Memulai ulang AR...';
                loadingEl.querySelector('.hint').textContent = 'Arahkan kamera ke gambar target';
                loadingEl.classList.remove('hidden');
                initMindAR();
            }, 500);
        }

        // ─── Event listeners ──────────────────────────────────────
        btnStart.addEventListener('click', () => {
            if (isRunning) return;
            loadingEl.classList.remove('hidden');
            loadingEl.querySelector('p').textContent = '⏳ Memulai AR Bumi...';
            loadingEl.querySelector('.hint').textContent = 'Pastikan kamera diizinkan & gambar target terlihat';
            initMindAR();
        });

        btnStop.addEventListener('click', stopAR);

        btnReset.addEventListener('click', resetAR);

        // ─── Auto-start saat halaman dimuat ──────────────────────
        // Tunggu sebentar agar DOM siap, lalu mulai otomatis
        setTimeout(() => {
            initMindAR();
        }, 600);

        // ─── Handle resize ────────────────────────────────────────
        window.addEventListener('resize', () => {
            if (mindarThree && mindarThree.renderer) {
                const w = container.clientWidth;
                const h = container.clientHeight;
                mindarThree.renderer.setSize(w, h);
                if (mindarThree.camera) {
                    mindarThree.camera.aspect = w / h;
                    mindarThree.camera.updateProjectionMatrix();
                }
            }
        });

        // ─── Cleanup jika halaman ditutup ────────────────────────
        window.addEventListener('beforeunload', async () => {
            if (mindarThree && isRunning) {
                try { await mindarThree.stop(); } catch (_) {}
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });

        // ─── Log info ─────────────────────────────────────────────
        console.log('🌍 AR Bumi dengan MindAR.js + Three.js');
        console.log('📄 Gunakan file target: bumi.mind');
        console.log('📷 Arahkan kamera ke gambar target untuk melihat Bumi 3D!');
    </script>
</body>
</html>
