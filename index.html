<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Bumi & Bulan — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #0f2027 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #22d3ee, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #overlay p {
            font-size: 14px;
            line-height: 1.6;
            color: #9fb4bb;
            max-width: 340px;
        }
        #overlay a {
            color: #22d3ee;
            text-decoration: underline;
        }
        #overlay .target-hint {
            background: rgba(34, 211, 238, 0.08);
            border: 1px dashed rgba(34, 211, 238, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            max-width: 320px;
        }

        #startBtn {
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #22d3ee, #0891b2);
            color: #06222a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.4);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(34, 211, 238, 0.3);
        }

        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 22px;
            }
            #overlay p {
                font-size: 13px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>🌍 Bumi &amp; Bulan</h1>
        <p>
            AR <strong>Image Tracking</strong> dengan MindAR + Three.js.<br>
            Arahkan kamera ke gambar target, dan lihat Bumi serta Bulan muncul di atasnya.
        </p>
        <div class="target-hint">
            🎯 Target: <a href="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" target="_blank" rel="noopener">buka/download gambar target</a>
            — tampilkan di layar lain atau cetak.
        </div>
        <button id="startBtn">🚀 Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>🌍 Cari gambar target…</span>
        <button id="stopBtn">✕ Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // ─── DOM refs ───────────────────────────────────────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let earthMesh = null;
        let orbitGroup = null;

        // ─── Fit "contain" untuk video & canvas ───────────────────
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ─── Texture loader dengan fallback ───────────────────────
        const textureLoader = new THREE.TextureLoader();

        function loadTextureWithFallback(url, fallbackColor) {
            return new Promise((resolve) => {
                textureLoader.load(
                    url,
                    (tex) => resolve(tex),
                    undefined,
                    () => {
                        // fallback: buat texture solid
                        const canvas = document.createElement('canvas');
                        canvas.width = 64;
                        canvas.height = 64;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = fallbackColor || '#888';
                        ctx.fillRect(0, 0, 64, 64);
                        const fallbackTex = new THREE.CanvasTexture(canvas);
                        resolve(fallbackTex);
                    }
                );
            });
        }

        // ─── Start AR ──────────────────────────────────────────────
        async function startAR() {
            try {
                statusMsg.textContent = '⏳ Meminta izin kamera…';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind",
                });

                const { renderer, scene, camera } = mindarThree;

                // ─── Pencahayaan ───────────────────────────────────
                const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a3a3a, 1.4);
                scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
                dirLight.position.set(1, 2, 1);
                scene.add(dirLight);

                const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4);
                fillLight.position.set(-0.8, 0.6, -0.5);
                scene.add(fillLight);

                // ─── Anchor target ─────────────────────────────────
                const anchor = mindarThree.addAnchor(0);

                // ─── Load textures ─────────────────────────────────
                statusMsg.textContent = '⏳ Memuat tekstur Bumi & Bulan…';

                const [earthTex, moonTex] = await Promise.all([
                    loadTextureWithFallback(
                        'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
                        '#2d7d9a'
                    ),
                    loadTextureWithFallback(
                        'https://threejs.org/examples/textures/planets/moon_1024.jpg',
                        '#b0b0b0'
                    ),
                ]);

                // ─── Bumi (dengan kemiringan sumbu 23.5°) ─────────
                const earthGroup = new THREE.Group();
                earthGroup.rotation.x = 0.41; // ~23.5°
                anchor.group.add(earthGroup);

                const earthGeo = new THREE.SphereGeometry(0.22, 64, 64);
                const earthMat = new THREE.MeshStandardMaterial({
                    map: earthTex,
                    roughness: 0.5,
                    metalness: 0.05,
                });
                earthMesh = new THREE.Mesh(earthGeo, earthMat);
                earthGroup.add(earthMesh);

                // ─── Atmosphere glow (lapisan tipis) ──────────────
                const glowGeo = new THREE.SphereGeometry(0.235, 48, 48);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0x4da6ff,
                    transparent: true,
                    opacity: 0.13,
                    side: THREE.BackSide,
                });
                const glowMesh = new THREE.Mesh(glowGeo, glowMat);
                earthGroup.add(glowMesh);

                // ─── Bulan ──────────────────────────────────────────
                // Orbit group dengan sedikit kemiringan (5°)
                orbitGroup = new THREE.Group();
                orbitGroup.rotation.x = 0.09;
                orbitGroup.rotation.z = 0.04;
                anchor.group.add(orbitGroup);

                const moonGeo = new THREE.SphereGeometry(0.055, 32, 32);
                const moonMat = new THREE.MeshStandardMaterial({
                    map: moonTex,
                    roughness: 0.9,
                    metalness: 0.0,
                });
                const moonMesh = new THREE.Mesh(moonGeo, moonMat);
                moonMesh.position.set(0.42, 0, 0);
                orbitGroup.add(moonMesh);

                // ─── Tambahan: bintang-bintang kecil di sekitar ──
                // (opsional, hanya untuk estetika)
                const starGeo = new THREE.BufferGeometry();
                const starCount = 160;
                const starPos = new Float32Array(starCount * 3);
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * 2.8;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.005,
                    transparent: true,
                    opacity: 0.6,
                    sizeAttenuation: true,
                });
                const stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.15;
                anchor.group.add(stars);

                // ─── Tampilkan AR ──────────────────────────────────
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // ─── Animasi loop ──────────────────────────────────
                renderer.setAnimationLoop(() => {
                    // Bumi berotasi pada sumbunya
                    if (earthMesh) earthMesh.rotation.y += 0.004;

                    // Bulan mengorbit
                    if (orbitGroup) orbitGroup.rotation.y += 0.012;

                    // Bintang berputar pelan
                    stars.rotation.y += 0.0004;

                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '✅ AR aktif!';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = '❌ Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ─── Stop AR ───────────────────────────────────────────────
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            earthMesh = null;
            orbitGroup = null;
        }

        // ─── Event listeners ──────────────────────────────────────
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
