<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AR Sederhana — MindAR + Three.js</title>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0b0f14; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  #container { position: fixed; inset: 0; display: none; }
  #container video, #container canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; object-fit: cover; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 32px;
    background: radial-gradient(circle at 50% 30%, #142a33 0%, #0b0f14 70%);
    color: #e7f6f8; text-align: center;
  }
  #overlay h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
  #overlay p { font-size: 14px; line-height: 1.6; color: #9fb4bb; max-width: 340px; }
  #overlay a { color: #22d3ee; text-decoration: underline; }

  #startBtn {
    padding: 14px 32px; font-size: 15px; font-weight: 600;
    background: #22d3ee; color: #06222a; border: none; border-radius: 999px;
    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 0 0 0 rgba(34,211,238,0.5);
  }
  #startBtn:active { transform: scale(0.96); }
  #startBtn:hover { box-shadow: 0 0 24px 2px rgba(34,211,238,0.35); }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: none; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
  }
  #hud span { color: #fff; font-size: 13px; opacity: 0.85; }
  #stopBtn {
    padding: 8px 16px; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px; cursor: pointer; backdrop-filter: blur(4px);
  }
</style>
</head>
<body>

  <div id="overlay">
    <h1>🔷 AR Sederhana</h1>
    <p>
      Demo image tracking pakai <strong>MindAR</strong> + <strong>Three.js</strong>.
      Arahkan kamera ke gambar target di bawah ini, nanti muncul kubus 3D di atasnya.
    </p>
    <p>
      Target: <a href="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" target="_blank" rel="noopener">buka/download gambar target</a>
      — tampilkan di layar HP/laptop lain atau di-print.
    </p>
    <button id="startBtn">Mulai AR</button>
    <p id="statusMsg" style="font-size:12px;color:#6f8890;"></p>
  </div>

  <div id="hud">
    <span>Arahkan kamera ke gambar target…</span>
    <button id="stopBtn">Stop</button>
  </div>

  <div id="container"></div>

  <script type="module">
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const overlay = document.getElementById('overlay');
    const hud = document.getElementById('hud');
    const container = document.getElementById('container');
    const statusMsg = document.getElementById('statusMsg');

    let mindarThree = null;

    async function startAR() {
      try {
        statusMsg.textContent = 'Meminta izin kamera…';
        const THREE = window.MINDAR.IMAGE.THREE;

        mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container,
          imageTargetSrc: "https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind",
        });

        const { renderer, scene, camera } = mindarThree;

        // Pencahayaan biar kubus kelihatan bentuknya, bukan cuma siluet
        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(0.5, 1, 0.5);
        scene.add(dirLight);

        // Anchor #0 nempel ke target image yang terdeteksi
        const anchor = mindarThree.addAnchor(0);

        const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const material = new THREE.MeshStandardMaterial({ color: 0x22d3ee, metalness: 0.2, roughness: 0.4 });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(0, 0.16, 0);
        anchor.group.add(cube);

        overlay.style.display = 'none';
        container.style.display = 'block';
        hud.style.display = 'flex';

        await mindarThree.start();

        renderer.setAnimationLoop(() => {
          cube.rotation.x += 0.01;
          cube.rotation.y += 0.02;
          renderer.render(scene, camera);
        });
      } catch (err) {
        console.error(err);
        statusMsg.textContent = 'Gagal mengakses kamera. Pastikan halaman dibuka lewat HTTPS atau localhost, dan izin kamera diberikan.';
      }
    }

    async function stopAR() {
      if (mindarThree) {
        await mindarThree.stop();
        mindarThree.renderer.setAnimationLoop(null);
      }
      container.style.display = 'none';
      hud.style.display = 'none';
      overlay.style.display = 'flex';
      statusMsg.textContent = '';
    }

    startBtn.addEventListener('click', startAR);
    stopBtn.addEventListener('click', stopAR);
  </script>
</body>
</html>
