<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Location-Based · Three.js</title>
    <style>
        /* ─── RESET & LAYOUT ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0b0b1a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
        }

        /* ─── LOADING ─── */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a2e, #0d0d1a);
            color: #fff;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #loading.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loading .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(255, 255, 255, 0.08);
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            margin-bottom: 24px;
        }
        #loading h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loading p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            margin-top: 6px;
        }
        #loading .bar-track {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin-top: 18px;
            overflow: hidden;
        }
        #loading .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ─── INFO OVERLAY ─── */
        #info {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 13px;
            font-weight: 400;
            text-align: center;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #info .emoji {
            font-size: 18px;
            margin-right: 8px;
        }
        #info .highlight {
            color: #a29bfe;
            font-weight: 600;
        }
        #info.gps-active {
            background: rgba(108, 92, 231, 0.25);
            border-color: rgba(108, 92, 231, 0.3);
        }
        #info.gps-active .highlight {
            color: #6c5ce7;
        }
        #info.gps-error {
            background: rgba(231, 76, 60, 0.25);
            border-color: rgba(231, 76, 60, 0.3);
        }
        #info.gps-error .highlight {
            color: #e74c3c;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            #info {
                font-size: 11px;
                padding: 10px 16px;
                bottom: 16px;
                white-space: normal;
                max-width: 90%;
                line-height: 1.4;
            }
            #loading h2 {
                font-size: 18px;
            }
            #loading p {
                font-size: 12px;
            }
        }

        /* ─── CANVAS ─── */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- ===== LOADING ===== -->
    <div id="loading">
        <div class="spinner"></div>
        <h2>AR Location-Based</h2>
        <p>Mengakses GPS &amp; kamera …</p>
        <div class="bar-track">
            <div class="bar-fill" id="loadBar"></div>
        </div>
    </div>

    <!-- ===== INFO ===== -->
    <div id="info">
        <span class="emoji">📍</span>
        <span id="infoText">Mencari lokasi GPS …</span>
    </div>

    <!-- ===== THREE.JS & AR.JS ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/three.js/build/ar-three.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/three.js/build/ar-location-based.js">
    </script>

    <!-- ===== MAIN ===== -->
    <script>
        (function() {
            'use strict';

            // ─── DOM refs ──────────────────────────────────────────────
            const loadingEl = document.getElementById('loading');
            const loadBar = document.getElementById('loadBar');
            const infoEl = document.getElementById('info');
            const infoText = document.getElementById('infoText');

            let loadProgress = 0;
            let gpsReady = false;
            let objectGroup = null;
            let animTime = 0;

            function updateLoad(progress) {
                loadProgress = Math.min(progress, 100);
                loadBar.style.width = loadProgress + '%';
                if (loadProgress >= 100) {
                    setTimeout(() => loadingEl.classList.add('hide'), 500);
                }
            }

            // ─── Scene / Camera / Renderer ────────────────────────────
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);

            const camera = new THREE.Camera();
            camera.position.set(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                powerPreference: 'high-performance',
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.prepend(renderer.domElement);

            // ─── Lights ────────────────────────────────────────────────
            const ambient = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambient);

            const key = new THREE.DirectionalLight(0xffeedd, 1.8);
            key.position.set(2, 4, 3);
            key.castShadow = true;
            key.shadow.mapSize.width = 1024;
            key.shadow.mapSize.height = 1024;
            scene.add(key);

            const fill = new THREE.DirectionalLight(0x4488ff, 0.6);
            fill.position.set(-2, 1, -2);
            scene.add(fill);

            const rim = new THREE.DirectionalLight(0xff8844, 0.4);
            rim.position.set(0, -1, -3);
            scene.add(rim);

            const hemi = new THREE.HemisphereLight(0x4466ff, 0x223344, 0.5);
            scene.add(hemi);

            // ─── Ground shadow plane ──────────────────────────────────
            const planeGeo = new THREE.PlaneGeometry(3, 3);
            const planeMat = new THREE.ShadowMaterial({ opacity: 0.3, color: 0x000000 });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -0.5;
            plane.receiveShadow = true;
            scene.add(plane);

            // ─── WebcamRenderer (for video background) ───────────────
            const webcamRenderer = new THREEx.WebcamRenderer(renderer, camera);

            // ─── LocationBased ────────────────────────────────────────
            const locationBased = new THREEx.LocationBased(scene, camera);

            // ─── Build 3D Object Group ───────────────────────────────
            function buildObjectGroup() {
                const group = new THREE.Group();

                // Torus Knot
                const knotGeo = new THREE.TorusKnotGeometry(0.5, 0.18, 128, 24);
                const knotMat = new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color('#6c5ce7'),
                    metalness: 0.25,
                    roughness: 0.15,
                    clearcoat: 0.35,
                    clearcoatRoughness: 0.25,
                    emissive: new THREE.Color('#3d2e7c'),
                    emissiveIntensity: 0.15,
                    envMapIntensity: 1.2,
                });
                const knot = new THREE.Mesh(knotGeo, knotMat);
                knot.castShadow = true;
                knot.receiveShadow = true;
                knot.position.y = 0.1;
                group.add(knot);

                // Glow ring
                const ringGeo = new THREE.TorusGeometry(0.58, 0.025, 48, 48);
                const ringMat = new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color('#a29bfe'),
                    emissive: new THREE.Color('#6c5ce7'),
                    emissiveIntensity: 0.6,
                    transparent: true,
                    opacity: 0.7,
                    roughness: 0.2,
                    metalness: 0.1,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = -0.05;
                group.add(ring);

                // Particles
                const pCount = 140;
                const pGeo = new THREE.BufferGeometry();
                const pos = new Float32Array(pCount * 3);
                for (let i = 0; i < pCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = 0.6 + Math.random() * 0.8;
                    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                    pos[i * 3 + 1] = r * Math.cos(phi) + 0.1;
                    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
                }
                pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const pMat = new THREE.PointsMaterial({
                    color: 0xa29bfe,
                    size: 0.025,
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true,
                });
                const particles = new THREE.Points(pGeo, pMat);
                group.add(particles);

                // Glow sphere wireframe
                const glowGeo = new THREE.SphereGeometry(0.75, 32, 32);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0x6c5ce7,
                    transparent: true,
                    opacity: 0.06,
                    wireframe: true,
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.y = 0.1;
                group.add(glow);

                // Store refs for animation
                group.userData = { knot, ring, particles, glow };
                return group;
            }

            // ─── Add object at GPS location ──────────────────────────
            function placeObject(lat, lon) {
                if (objectGroup) {
                    // Remove old if exists
                    // locationBased.remove(objectGroup) ? Not sure, we'll just not add again.
                    return;
                }

                objectGroup = buildObjectGroup();
                // Place object ~5 meter north-east of user
                const offsetLat = 0.000045; // ~5m
                const offsetLon = 0.000045;
                const objLat = lat + offsetLat;
                const objLon = lon + offsetLon;
                const altitude = 1.8; // meter above ground

                locationBased.add(objectGroup, objLon, objLat, altitude);

                // Update info
                infoEl.classList.remove('gps-error');
                infoEl.classList.add('gps-active');
                infoText.innerHTML =
                    '✨ Objek 3D <span class="highlight">muncul</span> di sekitar Anda!';
                gpsReady = true;
                updateLoad(100);
            }

            // ─── GPS handling ─────────────────────────────────────────
            function startGPS() {
                if (!navigator.geolocation) {
                    infoEl.classList.add('gps-error');
                    infoText.innerHTML = '❌ GPS <span class="highlight">tidak didukung</span> perangkat ini.';
                    updateLoad(100);
                    return;
                }

                const options = {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 5000,
                };

                let watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        if (!gpsReady) {
                            // First fix → place object
                            placeObject(latitude, longitude);
                            // Stop watching after placement (or keep watching for updates?)
                            // For demo, we keep watching to update? But object stays.
                            // We'll keep watching but only place once.
                        }
                        // Update info with coordinates (optional)
                        const latStr = latitude.toFixed(5);
                        const lonStr = longitude.toFixed(5);
                        if (gpsReady) {
                            infoText.innerHTML =
                                `📍 <span class="highlight">${latStr}</span> , <span class="highlight">${lonStr}</span>`;
                        } else {
                            infoText.innerHTML =
                                `📍 Mendapatkan lokasi … <span class="highlight">${latStr}</span> , <span class="highlight">${lonStr}</span>`;
                        }
                    },
                    (err) => {
                        console.warn('GPS error:', err);
                        infoEl.classList.add('gps-error');
                        infoText.innerHTML =
                            '⚠️ Gagal mendapatkan GPS. Pastikan izin lokasi diberikan.';
                        updateLoad(100);
                    }, options
                );

                // If no fix within 10s, show timeout message
                setTimeout(() => {
                    if (!gpsReady) {
                        infoEl.classList.add('gps-error');
                        infoText.innerHTML =
                            '⏳ GPS <span class="highlight">timeout</span>. Coba di luar ruangan.';
                        updateLoad(100);
                    }
                }, 12000);
            }

            // ─── Resize ────────────────────────────────────────────────
            window.addEventListener('resize', () => {
                const w = window.innerWidth;
                const h = window.innerHeight;
                renderer.setSize(w, h);
                if (camera) {
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                }
            });

            // ─── Animation Loop ────────────────────────────────────────
            function animate() {
                requestAnimationFrame(animate);
                animTime += 0.012;

                // Animate object group if exists
                if (objectGroup) {
                    const { knot, ring, particles, glow } = objectGroup.userData;
                    if (knot) {
                        knot.rotation.x += 0.008;
                        knot.rotation.y += 0.015;
                        knot.rotation.z += 0.005;
                        knot.position.y = 0.1 + Math.sin(animTime * 1.2) * 0.05;
                    }
                    if (ring) {
                        ring.rotation.z = animTime * 0.3;
                        ring.material.opacity = 0.5 + Math.sin(animTime * 0.8) * 0.2;
                    }
                    if (particles) {
                        particles.rotation.y = animTime * 0.1;
                        particles.rotation.x = Math.sin(animTime * 0.05) * 0.05;
                        const pos = particles.geometry.attributes.position.array;
                        for (let i = 0; i < pos.length / 3; i++) {
                            const idx = i * 3;
                            const speed = 0.002 + (i % 5) * 0.001;
                            pos[idx + 1] += Math.sin(animTime * 0.5 + i) * speed;
                            if (pos[idx + 1] > 0.6) pos[idx + 1] = -0.3;
                            if (pos[idx + 1] < -0.3) pos[idx + 1] = 0.6;
                        }
                        particles.geometry.attributes.position.needsUpdate = true;
                    }
                    if (glow) {
                        glow.rotation.x = animTime * 0.05;
                        glow.rotation.y = animTime * 0.07;
                        glow.material.opacity = 0.04 + Math.sin(animTime * 0.5) * 0.025;
                    }
                }

                // Update location-based (updates camera pose)
                if (locationBased) {
                    locationBased.update(performance.now());
                }

                // Render via webcam renderer (combines video + scene)
                if (webcamRenderer && camera) {
                    webcamRenderer.render(scene, camera);
                }
            }

            // ─── Start ─────────────────────────────────────────────────
            // Simulate loading progress while GPS initializes
            let prog = 0;
            const loadInterval = setInterval(() => {
                prog += Math.random() * 6 + 2;
                if (prog >= 95) {
                    clearInterval(loadInterval);
                }
                updateLoad(Math.min(prog, 95));
            }, 150);

            // Kick off GPS
            startGPS();

            // If GPS already ready, update load to 100 (handled in placeObject)
            // Fallback: if after 15s still not ready, force hide loading
            setTimeout(() => {
                if (!loadingEl.classList.contains('hide')) {
                    updateLoad(100);
                }
            }, 15000);

            // Start animation loop
            animate();

            // ─── Cleanup ──────────────────────────────────────────────
            window.addEventListener('beforeunload', () => {
                renderer.dispose();
                if (locationBased) {
                    // dispose if needed
                }
            });

            console.log('🌍 AR Location-Based siap!');
            console.log('📱 Izinkan GPS dan kamera untuk melihat objek 3D di sekitar Anda.');

        })();
    </script>
</body>
</html>
