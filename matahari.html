<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Matahari — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #0f2027 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1e1b0a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(251, 191, 36, 0.3);
        }

        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">🚀 Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>☀️ Cari gambar target…</span>
        <button id="stopBtn">✕ Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // ─── DOM refs ───────────────────────────────────────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let sunGroup = null;
        let sunMesh = null;
        let glowMesh = null;
        let sunLight = null;
        let stars = null;

        // ─── Fit "contain" untuk video & canvas ───────────────────
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ─── Buat tekstur Matahari yang bagus (procedural) ──────
        function createSunTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // 1. Gradasi dasar
            const grad = ctx.createRadialGradient(512, 512, 0, 512, 512, 512);
            grad.addColorStop(0, '#fffbe0');
            grad.addColorStop(0.2, '#fde047');
            grad.addColorStop(0.5, '#facc15');
            grad.addColorStop(0.8, '#f59e0b');
            grad.addColorStop(1, '#b45309');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            // 2. Bintik-bintik api (granulasi)
            for (let i = 0; i < 8000; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 8 + 1;
                const alpha = Math.random() * 0.3 + 0.05;
                const hue = 30 + Math.random() * 20;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 90%, 70%, ${alpha})`;
                ctx.fill();
            }

            // 3. Serat / garis-garis api
            ctx.strokeStyle = 'rgba(255, 200, 50, 0.08)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const len = Math.random() * 80 + 20;
                const angle = Math.random() * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
                ctx.stroke();
            }

            // 4. Beberapa titik terang (flare)
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 12 + 3;
                const grad2 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad2.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                grad2.addColorStop(1, 'rgba(255, 200, 50, 0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            return tex;
        }

        // ─── Start AR ──────────────────────────────────────────────
        async function startAR() {
            try {
                statusMsg.textContent = '⏳ Meminta izin kamera…';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/matahari.mind',
                });

                const { renderer, scene, camera } = mindarThree;

                // ─── Pencahayaan ambient untuk menerangi objek lain ──
                const ambient = new THREE.AmbientLight(0x222244, 0.5);
                scene.add(ambient);

                // ─── Anchor target ─────────────────────────────────
                const anchor = mindarThree.addAnchor(0);

                // ─── Buat Matahari dengan Three.js ────────────────
                const sunRadius = 0.4;
                const sunTexture = createSunTexture();

                // Material utama
                const sunMaterial = new THREE.MeshStandardMaterial({
                    map: sunTexture,
                    emissive: new THREE.Color(0xff8800),
                    emissiveIntensity: 0.6,
                    roughness: 0.3,
                    metalness: 0.0,
                });

                const geometry = new THREE.SphereGeometry(sunRadius, 64, 64);
                sunMesh = new THREE.Mesh(geometry, sunMaterial);
                sunGroup = new THREE.Group();
                sunGroup.add(sunMesh);

                // ─── Efek Glow / Corona ────────────────────────────
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: 0xff6600,
                    transparent: true,
                    opacity: 0.15,
                    side: THREE.BackSide,
                });
                const glowGeometry = new THREE.SphereGeometry(sunRadius * 1.4, 48, 48);
                glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
                sunGroup.add(glowMesh);

                // ─── Partikel api di sekitar (opsional) ────────────
                const particleCount = 400;
                const positions = new Float32Array(particleCount * 3);
                const sizes = new Float32Array(particleCount);
                for (let i = 0; i < particleCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const radius = sunRadius * (1.2 + Math.random() * 0.6);
                    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    positions[i * 3 + 2] = radius * Math.cos(phi);
                    sizes[i] = 0.02 + Math.random() * 0.03;
                }
                const particleGeo = new THREE.BufferGeometry();
                particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                const particleMat = new THREE.PointsMaterial({
                    color: 0xffaa44,
                    size: 0.02,
                    transparent: true,
                    opacity: 0.4,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true,
                });
                const particles = new THREE.Points(particleGeo, particleMat);
                sunGroup.add(particles);

                // Tambahkan ke anchor
                anchor.group.add(sunGroup);

                // ─── Point Light dari Matahari ─────────────────────
                sunLight = new THREE.PointLight(0xffaa44, 2.5, 0, 0);
                sunLight.position.set(0, 0, 0);
                anchor.group.add(sunLight);

                // ─── Bintang-bintang latar ─────────────────────────
                const starGeo = new THREE.BufferGeometry();
                const starCount = 300;
                const starPos = new Float32Array(starCount * 3);
                const spread = 5.0;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.008,
                    transparent: true,
                    opacity: 0.6,
                    sizeAttenuation: true,
                });
                stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.2;
                anchor.group.add(stars);

                // ─── Tampilkan AR ──────────────────────────────────
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // ─── Animasi Loop ──────────────────────────────────
                renderer.setAnimationLoop(() => {
                    // Rotasi Matahari
                    if (sunGroup) {
                        sunGroup.rotation.y += 0.003;
                        // Rotasi partikel juga
                        particles.rotation.y += 0.001;
                        particles.rotation.x += 0.0005;
                    }

                    // Bintang berputar pelan
                    if (stars) stars.rotation.y += 0.0002;

                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '✅ AR Matahari aktif!';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = '❌ Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ─── Stop AR ───────────────────────────────────────────────
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            sunGroup = null;
            sunMesh = null;
            glowMesh = null;
            sunLight = null;
            stars = null;
        }

        // ─── Event listeners ──────────────────────────────────────
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
