<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Matahari — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #0f2027 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1e1b0a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(251, 191, 36, 0.3);
        }

        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">🚀 Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>☀️ Cari gambar target…</span>
        <button id="stopBtn">✕ Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // ─── DOM refs ───────────────────────────────────────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let sunGroup = null;
        let sunLight = null;
        let textureLoader = new THREE.TextureLoader();

        // ─── Fit "contain" untuk video & canvas ───────────────────
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ─── Buat matahari dengan texture online ───────────────────
        function createSun() {
            const group = new THREE.Group();

            // Texture matahari dari sumber online (high-res)
            const sunMap = textureLoader.load(
                'https://threejs.org/examples/textures/planets/sun.jpg',
                () => console.log('✅ Texture matahari loaded'),
                undefined,
                () => console.warn('⚠️ Gagal load texture, pakai fallback')
            );

            // Radius matahari
            const radius = 0.5;

            // 1. Bola utama dengan texture
            const geo = new THREE.SphereGeometry(radius, 80, 80);
            const mat = new THREE.MeshStandardMaterial({
                map: sunMap,
                emissive: new THREE.Color(0xff8800),
                emissiveIntensity: 1.2,
                roughness: 0.2,
                metalness: 0.0,
            });
            const mesh = new THREE.Mesh(geo, mat);
            group.add(mesh);

            // 2. Lapisan glow dalam (corona) - 2 lapis
            const glowMat1 = new THREE.MeshBasicMaterial({
                color: 0xff6600,
                transparent: true,
                opacity: 0.18,
                side: THREE.BackSide,
            });
            const glow1 = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.5, 48, 48), glowMat1);
            group.add(glow1);

            const glowMat2 = new THREE.MeshBasicMaterial({
                color: 0xffaa44,
                transparent: true,
                opacity: 0.08,
                side: THREE.BackSide,
            });
            const glow2 = new THREE.Mesh(new THREE.SphereGeometry(radius * 2.0, 48, 48), glowMat2);
            group.add(glow2);

            // 3. Partikel api berkilau (lebih banyak dan lebih terang)
            const particleCount = 600;
            const positions = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const colors = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = radius * (1.2 + Math.random() * 1.0);
                positions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
                positions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
                positions[i * 3 + 2] = Math.cos(phi) * r;
                sizes[i] = 0.015 + Math.random() * 0.03;

                // Warna: oranye hingga kuning
                const color = new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 1, 0.5 + Math.random() * 0.4);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }
            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 0.035,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
                vertexColors: true,
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            group.add(particles);

            return group;
        }

        // ─── Start AR ──────────────────────────────────────────────
        async function startAR() {
            try {
                statusMsg.textContent = '⏳ Meminta izin kamera…';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/matahari.mind',
                });

                const { renderer, scene, camera } = mindarThree;

                // ─── Pencahayaan lingkungan ────────────────────────
                const ambient = new THREE.AmbientLight(0x404060);
                scene.add(ambient);
                const hemi = new THREE.HemisphereLight(0xffdd88, 0x080820, 0.6);
                scene.add(hemi);

                // ─── Anchor target ─────────────────────────────────
                const anchor = mindarThree.addAnchor(0);

                // ─── Buat Matahari ─────────────────────────────────
                sunGroup = createSun();
                anchor.group.add(sunGroup);

                // ─── Point light dari matahari ─────────────────────
                sunLight = new THREE.PointLight(0xffaa44, 3.0, 0, 0);
                sunLight.position.set(0, 0, 0);
                anchor.group.add(sunLight);

                // ─── Bintang-bintang latar ─────────────────────────
                const starGeo = new THREE.BufferGeometry();
                const starCount = 400;
                const starPos = new Float32Array(starCount * 3);
                const starColors = new Float32Array(starCount * 3);
                const spread = 6;
                for (let i = 0; i < starCount; i++) {
                    starPos[i * 3] = (Math.random() - 0.5) * spread;
                    starPos[i * 3 + 1] = (Math.random() - 0.5) * spread;
                    starPos[i * 3 + 2] = (Math.random() - 0.5) * spread;
                    const brightness = 0.5 + Math.random() * 0.5;
                    starColors[i * 3] = brightness;
                    starColors[i * 3 + 1] = brightness;
                    starColors[i * 3 + 2] = brightness;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
                const starMat = new THREE.PointsMaterial({
                    size: 0.012,
                    transparent: true,
                    opacity: 0.8,
                    sizeAttenuation: true,
                    vertexColors: true,
                });
                const stars = new THREE.Points(starGeo, starMat);
                anchor.group.add(stars);

                // ─── Tampilkan AR ──────────────────────────────────
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // ─── Animasi ──────────────────────────────────────
                renderer.setAnimationLoop(() => {
                    if (sunGroup) {
                        // Rotasi utama
                        sunGroup.rotation.y += 0.0015;
                        // Partikel berputar lebih cepat dan dengan sumbu berbeda
                        sunGroup.children.forEach(child => {
                            if (child.isPoints) {
                                child.rotation.y += 0.004;
                                child.rotation.x += 0.001;
                            }
                        });
                    }
                    stars.rotation.y += 0.00015;
                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '✅ AR Matahari aktif!';

            } catch (err) {
                console.error('❌ Error:', err);
                statusMsg.textContent = '❌ Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ─── Stop AR ───────────────────────────────────────────────
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            sunGroup = null;
            sunLight = null;
        }

        // ─── Event listeners ──────────────────────────────────────
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
