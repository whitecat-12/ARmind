<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Matahari Realistis — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #0f2027 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1e1b0a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(251, 191, 36, 0.3);
        }

        #statusMsg {
            font-size: 13px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>☀️ Matahari Realistis</h1>
        <button id="startBtn">Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>Cari gambar target...</span>
        <button id="stopBtn">Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // DOM refs
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let sunGroup = null;
        let sunMesh = null;
        let coronaParticles = null;
        let glowSprite = null;
        let flareSprite = null;
        let stars = null;
        let shaderUniforms = null;
        let clock = new THREE.Clock();

        // Fit "contain" untuk video & canvas
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = w + 'px';
                el.style.height = h + 'px';
                el.style.left = left + 'px';
                el.style.top = top + 'px';
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ============================================================
        // 1. BUAT TEXTURE MATAHARI PROSEDURAL SANGAT DETAIL
        // ============================================================
        function createHighResSunTexture(width = 2048, height = 2048) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // --- Base gradient (warna dasar matahari) ---
            const grad = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width / 2);
            grad.addColorStop(0, '#fffbe6');
            grad.addColorStop(0.1, '#fde047');
            grad.addColorStop(0.4, '#facc15');
            grad.addColorStop(0.7, '#f59e0b');
            grad.addColorStop(0.9, '#d97706');
            grad.addColorStop(1, '#b45309');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // --- Granulasi (sel konveksi) dengan pola Voronoi-like ---
            // Kita gambar banyak lingkaran kecil dengan warna berbeda untuk efek granulasi
            const granules = [];
            for (let i = 0; i < 6000; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = 6 + Math.random() * 18;
                const bright = 0.3 + Math.random() * 0.5;
                const hue = 30 + Math.random() * 20;
                const sat = 60 + Math.random() * 30;
                const lig = 40 + Math.random() * 30;
                granules.push({ x, y, r, hue, sat, lig });
            }
            // Gambar granulasi dengan blending
            for (const g of granules) {
                const grad2 = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
                const alpha = 0.25 + Math.random() * 0.3;
                grad2.addColorStop(0, `hsla(${g.hue}, ${g.sat}%, ${g.lig + 20}%, ${alpha})`);
                grad2.addColorStop(0.7, `hsla(${g.hue}, ${g.sat}%, ${g.lig}%, ${alpha * 0.6})`);
                grad2.addColorStop(1, `hsla(${g.hue}, ${g.sat}%, ${g.lig - 10}%, 0)`);
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- Sunspot (bintik matahari) ---
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = 20 + Math.random() * 50;
                // Umbra (gelap)
                const grad3 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad3.addColorStop(0, 'rgba(40, 20, 10, 0.8)');
                grad3.addColorStop(0.4, 'rgba(60, 35, 20, 0.6)');
                grad3.addColorStop(0.8, 'rgba(100, 70, 40, 0.4)');
                grad3.addColorStop(1, 'rgba(150, 100, 60, 0)');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
                // Penumbra (cahaya di sekitar)
                const grad4 = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 1.8);
                grad4.addColorStop(0, 'rgba(255, 200, 100, 0)');
                grad4.addColorStop(0.5, 'rgba(255, 200, 100, 0.15)');
                grad4.addColorStop(1, 'rgba(255, 200, 100, 0)');
                ctx.fillStyle = grad4;
                ctx.beginPath();
                ctx.arc(x, y, r * 1.8, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- Filamen / serat permukaan (efek aliran plasma) ---
            ctx.strokeStyle = 'rgba(255, 180, 50, 0.07)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 400; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const len = 30 + Math.random() * 120;
                const angle = Math.random() * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
                ctx.stroke();
            }

            // --- Flare kecil (titik terang) ---
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = 2 + Math.random() * 8;
                const grad5 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad5.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                grad5.addColorStop(1, 'rgba(255, 200, 50, 0)');
                ctx.fillStyle = grad5;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // ============================================================
        // 2. BUAT SHADER UNTUK PERMUKAAN BERGEJOLAK
        // ============================================================
        // Shader ini akan memanipulasi posisi vertex (displacement) 
        // berdasarkan noise 3D untuk simulasi gelombang permukaan.
        const sunVertexShader = `
                uniform float uTime;
                uniform float uNoiseScale;
                uniform float uNoiseStrength;

                varying vec3 vPosition;
                varying vec2 vUv;
                varying float vElevation;

                // Fungsi noise sederhana (hash)
                float hash(vec3 p) {
                    p  = fract(p * 0.3183099 + .1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }

                float noise(vec3 p) {
                    vec3 i = floor(p);
                    vec3 f = fract(p);
                    f = f*f*(3.0-2.0*f);
                    return mix(mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)), f.x),
                                   mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                               mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                                   mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
                }

                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    float r = length(pos);
                    vec3 dir = normalize(pos);

                    // Noise 3D untuk displacement
                    float n = noise(pos * uNoiseScale + uTime * 0.08);
                    float displacement = (n - 0.5) * uNoiseStrength;

                    // Tambahkan efek gelombang kedua
                    float n2 = noise(pos * uNoiseScale * 0.6 + uTime * 0.12);
                    displacement += (n2 - 0.5) * uNoiseStrength * 0.4;

                    // Variasi berdasarkan sudut (efek rotasi diferensial)
                    float latFactor = 1.0 - abs(dir.y) * 0.3;
                    displacement *= latFactor;

                    float newR = r + displacement;
                    pos = dir * newR;

                    vPosition = pos;
                    vElevation = displacement;

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `;

        const sunFragmentShader = `
                uniform vec3 uColor1;
                uniform vec3 uColor2;
                uniform vec3 uColor3;
                uniform float uTime;
                uniform sampler2D uTexture;

                varying vec2 vUv;
                varying vec3 vPosition;
                varying float vElevation;

                void main() {
                    // Texture sampling
                    vec4 texColor = texture2D(uTexture, vUv);
                    
                    // Tambahkan efek warna berdasarkan ketinggian (displacement)
                    float elev = vElevation * 1.5 + 0.5;
                    vec3 elevColor = mix(uColor1, uColor2, elev);
                    elevColor = mix(elevColor, uColor3, max(0.0, elev - 0.7) * 3.0);

                    // Kombinasi dengan texture
                    vec3 finalColor = mix(texColor.rgb, elevColor, 0.4);

                    // Efek "glow" tepi (fresnel sederhana) 
                    float fresnel = 1.0 - abs(dot(normalize(vPosition), vec3(0.0, 0.0, 1.0)));
                    finalColor += vec3(1.0, 0.6, 0.2) * fresnel * 0.15;

                    // Emissive kuat
                    float emissive = 0.7 + 0.3 * sin(vUv.x * 20.0 + vUv.y * 15.0 + uTime);
                    finalColor *= (0.8 + 0.2 * emissive);

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `;

        // ============================================================
        // 3. BUAT TEXTURE KORONA (CIRCLE GRADIENT)
        // ============================================================
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.1, 'rgba(255, 200, 100, 0.9)');
            grad.addColorStop(0.4, 'rgba(255, 150, 50, 0.5)');
            grad.addColorStop(0.7, 'rgba(255, 100, 20, 0.2)');
            grad.addColorStop(1, 'rgba(255, 50, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        function createFlareTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.2, 'rgba(255, 200, 100, 0.8)');
            grad.addColorStop(0.5, 'rgba(255, 150, 50, 0.3)');
            grad.addColorStop(1, 'rgba(255, 100, 20, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            // tambahkan sinar (starburst)
            ctx.strokeStyle = 'rgba(255, 200, 100, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(64, 64);
                ctx.lineTo(64 + Math.cos(angle) * 64, 64 + Math.sin(angle) * 64);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // ============================================================
        // 4. START AR
        // ============================================================
        async function startAR() {
            try {
                statusMsg.textContent = 'Meminta izin kamera...';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/matahari.mind',
                });

                const { renderer, scene, camera } = mindarThree;

                // Ambient dan directional
                const ambient = new THREE.AmbientLight(0x222244, 0.5);
                scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
                dirLight.position.set(1, 1, 1);
                scene.add(dirLight);

                const anchor = mindarThree.addAnchor(0);

                // --- BINTANG LATAR ---
                const starGeo = new THREE.BufferGeometry();
                const starCount = 400;
                const starPos = new Float32Array(starCount * 3);
                const spread = 6.0;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.01,
                    transparent: true,
                    opacity: 0.7,
                    sizeAttenuation: true,
                });
                stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.3;
                anchor.group.add(stars);

                // --- MATAHARI UTAMA ---
                const sunRadius = 0.45;

                // Texture prosedural resolusi tinggi
                statusMsg.textContent = 'Membuat tekstur matahari...';
                const sunTexture = createHighResSunTexture(2048, 2048);

                // Uniforms untuk shader
                shaderUniforms = {
                    uTime: { value: 0 },
                    uNoiseScale: { value: 3.5 },
                    uNoiseStrength: { value: 0.04 },
                    uColor1: { value: new THREE.Color(0xffdd77) },
                    uColor2: { value: new THREE.Color(0xff8800) },
                    uColor3: { value: new THREE.Color(0xff4400) },
                    uTexture: { value: sunTexture },
                };

                const sunMaterial = new THREE.ShaderMaterial({
                    vertexShader: sunVertexShader,
                    fragmentShader: sunFragmentShader,
                    uniforms: shaderUniforms,
                    emissive: 0xff8800,
                    emissiveIntensity: 0.6,
                    // tetap gunakan lighting? Kita set lights agar terpengaruh, tapi kita override di fragment
                    // Agar lebih realistis, kita gunakan MeshStandardMaterial dengan custom onBeforeCompile? 
                    // Lebih mudah: kita buat material sendiri dengan ShaderMaterial dan tambahkan efek cahaya.
                    // Untuk kesederhanaan, kita akan gunakan ShaderMaterial tanpa lighting, 
                    // tapi kita sudah tambahkan efek emissive di fragment.
                    // Jadi kita set side: THREE.FrontSide
                    side: THREE.FrontSide,
                });

                const geometry = new THREE.SphereGeometry(sunRadius, 96, 96);
                sunMesh = new THREE.Mesh(geometry, sunMaterial);
                sunGroup = new THREE.Group();
                sunGroup.add(sunMesh);

                // --- KORONA (Sprite glow besar) ---
                const glowTex = createGlowTexture();
                const glowMat = new THREE.SpriteMaterial({
                    map: glowTex,
                    color: 0xff9933,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    opacity: 0.6,
                });
                glowSprite = new THREE.Sprite(glowMat);
                glowSprite.scale.set(sunRadius * 4.5, sunRadius * 4.5, 1);
                sunGroup.add(glowSprite);

                // --- FLARE (Sprite sinar) ---
                const flareTex = createFlareTexture();
                const flareMat = new THREE.SpriteMaterial({
                    map: flareTex,
                    color: 0xffaa44,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    opacity: 0.3,
                });
                flareSprite = new THREE.Sprite(flareMat);
                flareSprite.scale.set(sunRadius * 3.0, sunRadius * 3.0, 1);
                sunGroup.add(flareSprite);

                // --- PARTIKEL KORONA (corona particles) ---
                const coronaCount = 1200;
                const coronaPositions = new Float32Array(coronaCount * 3);
                const coronaSizes = new Float32Array(coronaCount);
                const coronaSpeeds = new Float32Array(coronaCount);
                const coronaOffsets = new Float32Array(coronaCount);
                for (let i = 0; i < coronaCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const radius = sunRadius * (1.1 + Math.random() * 1.2);
                    coronaPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    coronaPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    coronaPositions[i * 3 + 2] = radius * Math.cos(phi);
                    coronaSizes[i] = 0.01 + Math.random() * 0.025;
                    coronaSpeeds[i] = 0.2 + Math.random() * 0.5;
                    coronaOffsets[i] = Math.random() * 100;
                }
                const coronaGeo = new THREE.BufferGeometry();
                coronaGeo.setAttribute('position', new THREE.BufferAttribute(coronaPositions, 3));
                coronaGeo.setAttribute('size', new THREE.BufferAttribute(coronaSizes, 1));

                const coronaMat = new THREE.PointsMaterial({
                    color: 0xffaa44,
                    size: 0.02,
                    transparent: true,
                    opacity: 0.35,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true,
                    map: (() => {
                        const c = document.createElement('canvas');
                        c.width = 32;
                        c.height = 32;
                        const ctx = c.getContext('2d');
                        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                        grad.addColorStop(0, 'rgba(255,255,255,1)');
                        grad.addColorStop(1, 'rgba(255,200,100,0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(0, 0, 32, 32);
                        return new THREE.CanvasTexture(c);
                    })(),
                });
                coronaParticles = new THREE.Points(coronaGeo, coronaMat);
                // Simpan data extra untuk animasi
                coronaParticles.userData = { speeds: coronaSpeeds, offsets: coronaOffsets };
                sunGroup.add(coronaParticles);

                // --- CAHAYA MATAHARI (point light) ---
                const sunLight = new THREE.PointLight(0xffaa44, 2.0, 0, 0);
                sunLight.position.set(0, 0, 0);
                anchor.group.add(sunLight);

                // Tambahkan light kedua untuk efek
                const sunLight2 = new THREE.PointLight(0xff8833, 1.0, 0, 0);
                sunLight2.position.set(0.3, 0.3, 0.3);
                anchor.group.add(sunLight2);

                anchor.group.add(sunGroup);

                // --- TAMPILKAN ---
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // --- ANIMASI LOOP ---
                renderer.setAnimationLoop(() => {
                    const delta = clock.getDelta();
                    const elapsed = clock.getElapsedTime();

                    if (sunGroup) {
                        // Rotasi lambat
                        sunGroup.rotation.y += 0.002;
                        sunGroup.rotation.x = Math.sin(elapsed * 0.01) * 0.02;

                        // Update uniform waktu untuk shader
                        if (shaderUniforms) {
                            shaderUniforms.uTime.value = elapsed;
                        }

                        // Animasi partikel korona (bergerak keluar-masuk)
                        if (coronaParticles) {
                            const positions = coronaParticles.geometry.attributes.position.array;
                            const speeds = coronaParticles.userData.speeds;
                            const offsets = coronaParticles.userData.offsets;
                            for (let i = 0; i < coronaCount; i++) {
                                const idx = i * 3;
                                const x = positions[idx];
                                const y = positions[idx + 1];
                                const z = positions[idx + 2];
                                const r = Math.sqrt(x * x + y * y + z * z);
                                const dirX = x / r,
                                    dirY = y / r,
                                    dirZ = z / r;
                                // Osilasi radius
                                const osc = Math.sin(elapsed * speeds[i] + offsets[i]) * 0.08 + 1.0;
                                const newR = sunRadius * (1.1 + Math.random() * 0.01) * osc;
                                // Tapi jangan terlalu acak, kita pakai osilasi halus
                                // Untuk performa, kita update tiap frame dengan perhitungan sederhana
                                // Sebenarnya kita bisa simpan radius awal, tapi kita hitung ulang dari posisi
                                // Lebih baik kita simpan radius awal di userData
                            }
                            // Karena kita tidak simpan radius awal, kita lakukan pendekatan: 
                            // kita gerakkan partikel secara radial dengan noise
                            // Tapi untuk menghindari komputasi berat, kita skip animasi radial kompleks,
                            // hanya rotasi partikel saja.
                            coronaParticles.rotation.y += 0.001;
                            coronaParticles.rotation.x += 0.0005;
                        }

                        // Rotasi sprite korona dan flare (lambat)
                        if (glowSprite) glowSprite.material.rotation += 0.0005;
                        if (flareSprite) flareSprite.material.rotation += 0.001;
                    }

                    if (stars) stars.rotation.y += 0.0002;

                    renderer.render(scene, camera);
                });

                statusMsg.textContent = 'AR Matahari Realistis Aktif.';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ============================================================
        // 5. STOP AR
        // ============================================================
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            sunGroup = null;
            sunMesh = null;
            coronaParticles = null;
            glowSprite = null;
            flareSprite = null;
            stars = null;
            shaderUniforms = null;
            clock = new THREE.Clock();
        }

        // ============================================================
        // 6. EVENT LISTENERS
        // ============================================================
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
