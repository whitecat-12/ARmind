<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Matahari Realistis — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #0f2027 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1e1b0a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(251, 191, 36, 0.3);
        }

        #statusMsg {
            font-size: 13px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>Cari gambar target...</span>
        <button id="stopBtn">Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // DOM refs
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let sunGroup = null;
        let sunMesh = null;
        let coronaParticles = null;
        let glowSprite = null;
        let stars = null;
        let shaderUniforms = null;
        let clock = new THREE.Clock();

        // Fit "contain" untuk video & canvas
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = w + 'px';
                el.style.height = h + 'px';
                el.style.left = left + 'px';
                el.style.top = top + 'px';
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ============================================================
        // 1. TEXTURE MATAHARI PROSEDURAL (DETAIL RENDAH BINTIK)
        // ============================================================
        function createRealisticSunTexture(width = 2048, height = 2048) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Base gradient (warna halus)
            const grad = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width / 2);
            grad.addColorStop(0, '#fffbe6');
            grad.addColorStop(0.15, '#fde047');
            grad.addColorStop(0.5, '#facc15');
            grad.addColorStop(0.8, '#f59e0b');
            grad.addColorStop(0.95, '#d97706');
            grad.addColorStop(1, '#b45309');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Granulasi halus (lebih sedikit dan lebih kecil)
            for (let i = 0; i < 2000; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = 4 + Math.random() * 12;
                const hue = 30 + Math.random() * 15;
                const sat = 60 + Math.random() * 20;
                const lig = 50 + Math.random() * 20;
                const alpha = 0.15 + Math.random() * 0.2;
                const grad2 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad2.addColorStop(0, `hsla(${hue}, ${sat}%, ${lig + 15}%, ${alpha})`);
                grad2.addColorStop(0.7, `hsla(${hue}, ${sat}%, ${lig}%, ${alpha * 0.6})`);
                grad2.addColorStop(1, `hsla(${hue}, ${sat}%, ${lig - 10}%, 0)`);
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Sunspot lebih sedikit dan lebih halus
            for (let i = 0; i < 8; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = 30 + Math.random() * 60;
                // Umbra
                const grad3 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad3.addColorStop(0, 'rgba(50, 30, 15, 0.6)');
                grad3.addColorStop(0.5, 'rgba(80, 50, 30, 0.4)');
                grad3.addColorStop(1, 'rgba(120, 80, 50, 0)');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
                // Penumbra tipis
                const grad4 = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.0);
                grad4.addColorStop(0, 'rgba(255, 200, 100, 0)');
                grad4.addColorStop(0.5, 'rgba(255, 200, 100, 0.08)');
                grad4.addColorStop(1, 'rgba(255, 200, 100, 0)');
                ctx.fillStyle = grad4;
                ctx.beginPath();
                ctx.arc(x, y, r * 2.0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Hilangkan filamen dan flare kecil agar tidak terlalu ramai

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // ============================================================
        // 2. SHADER PERMUKAAN BERGEJOLAK (DIKURANGI FRESNEL & EMISSIVE)
        // ============================================================
        const sunVertexShader = `
                uniform float uTime;
                uniform float uNoiseScale;
                uniform float uNoiseStrength;

                varying vec3 vPosition;
                varying vec2 vUv;
                varying float vElevation;

                float hash(vec3 p) {
                    p  = fract(p * 0.3183099 + .1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }

                float noise(vec3 p) {
                    vec3 i = floor(p);
                    vec3 f = fract(p);
                    f = f*f*(3.0-2.0*f);
                    return mix(mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)), f.x),
                                   mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                               mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                                   mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
                }

                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    float r = length(pos);
                    vec3 dir = normalize(pos);

                    float n = noise(pos * uNoiseScale + uTime * 0.08);
                    float displacement = (n - 0.5) * uNoiseStrength;
                    float n2 = noise(pos * uNoiseScale * 0.6 + uTime * 0.12);
                    displacement += (n2 - 0.5) * uNoiseStrength * 0.4;
                    float latFactor = 1.0 - abs(dir.y) * 0.3;
                    displacement *= latFactor;

                    float newR = r + displacement;
                    pos = dir * newR;

                    vPosition = pos;
                    vElevation = displacement;

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `;

        const sunFragmentShader = `
                uniform vec3 uColor1;
                uniform vec3 uColor2;
                uniform vec3 uColor3;
                uniform float uTime;
                uniform sampler2D uTexture;

                varying vec2 vUv;
                varying vec3 vPosition;
                varying float vElevation;

                void main() {
                    vec4 texColor = texture2D(uTexture, vUv);
                    
                    // Efek elevasi sangat halus
                    float elev = vElevation * 1.2 + 0.5;
                    vec3 elevColor = mix(uColor1, uColor2, elev);
                    elevColor = mix(elevColor, uColor3, max(0.0, elev - 0.8) * 2.0);

                    vec3 finalColor = mix(texColor.rgb, elevColor, 0.25);

                    // Fresnel sangat tipis (hanya untuk kedalaman)
                    float fresnel = 1.0 - abs(dot(normalize(vPosition), vec3(0.0, 0.0, 1.0)));
                    finalColor += vec3(1.0, 0.5, 0.1) * fresnel * 0.05;

                    // Emissive halus
                    float emissive = 0.9 + 0.1 * sin(vUv.x * 30.0 + vUv.y * 20.0 + uTime * 0.5);
                    finalColor *= emissive;

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `;

        // ============================================================
        // 3. TEXTURE KORONA (HALUS)
        // ============================================================
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.15, 'rgba(255, 200, 100, 0.8)');
            grad.addColorStop(0.5, 'rgba(255, 150, 50, 0.4)');
            grad.addColorStop(0.8, 'rgba(255, 100, 20, 0.1)');
            grad.addColorStop(1, 'rgba(255, 50, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        // ============================================================
        // 4. START AR
        // ============================================================
        async function startAR() {
            try {
                statusMsg.textContent = 'Meminta izin kamera...';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/matahari.mind',
                });

                const { renderer, scene, camera } = mindarThree;

                // Pencahayaan minimal
                const ambient = new THREE.AmbientLight(0x223344, 0.6);
                scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
                dirLight.position.set(1, 1, 1);
                scene.add(dirLight);

                const anchor = mindarThree.addAnchor(0);

                // --- BINTANG LATAR ---
                const starGeo = new THREE.BufferGeometry();
                const starCount = 300;
                const starPos = new Float32Array(starCount * 3);
                const spread = 5.0;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.008,
                    transparent: true,
                    opacity: 0.5,
                    sizeAttenuation: true,
                });
                stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.3;
                anchor.group.add(stars);

                // --- MATAHARI UTAMA ---
                const sunRadius = 0.4;

                // Buat tekstur prosedural realistis
                statusMsg.textContent = 'Membuat tekstur matahari...';
                const sunTexture = createRealisticSunTexture(2048, 2048);

                shaderUniforms = {
                    uTime: { value: 0 },
                    uNoiseScale: { value: 3.5 },
                    uNoiseStrength: { value: 0.035 },
                    uColor1: { value: new THREE.Color(0xffdd77) },
                    uColor2: { value: new THREE.Color(0xff8800) },
                    uColor3: { value: new THREE.Color(0xff4400) },
                    uTexture: { value: sunTexture },
                };

                const sunMaterial = new THREE.ShaderMaterial({
                    vertexShader: sunVertexShader,
                    fragmentShader: sunFragmentShader,
                    uniforms: shaderUniforms,
                    side: THREE.FrontSide,
                });

                const geometry = new THREE.SphereGeometry(sunRadius, 96, 96);
                sunMesh = new THREE.Mesh(geometry, sunMaterial);
                sunGroup = new THREE.Group();
                sunGroup.add(sunMesh);

                // --- KORONA (Sprite glow halus) ---
                const glowTex = createGlowTexture();
                const glowMat = new THREE.SpriteMaterial({
                    map: glowTex,
                    color: 0xff9933,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    opacity: 0.5,
                });
                glowSprite = new THREE.Sprite(glowMat);
                glowSprite.scale.set(sunRadius * 4.0, sunRadius * 4.0, 1);
                sunGroup.add(glowSprite);

                // --- PARTIKEL KORONA (SEDIKIT DAN HALUS) ---
                const coronaCount = 400;
                const coronaPositions = new Float32Array(coronaCount * 3);
                for (let i = 0; i < coronaCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const radius = sunRadius * (1.2 + Math.random() * 1.0);
                    coronaPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    coronaPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    coronaPositions[i * 3 + 2] = radius * Math.cos(phi);
                }
                const coronaGeo = new THREE.BufferGeometry();
                coronaGeo.setAttribute('position', new THREE.BufferAttribute(coronaPositions, 3));

                // Buat texture bulat untuk partikel
                const particleCanvas = document.createElement('canvas');
                particleCanvas.width = 32;
                particleCanvas.height = 32;
                const pctx = particleCanvas.getContext('2d');
                const pgrad = pctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                pgrad.addColorStop(0, 'rgba(255,255,200,1)');
                pgrad.addColorStop(0.5, 'rgba(255,200,100,0.6)');
                pgrad.addColorStop(1, 'rgba(255,150,50,0)');
                pctx.fillStyle = pgrad;
                pctx.fillRect(0, 0, 32, 32);
                const particleTexture = new THREE.CanvasTexture(particleCanvas);

                const coronaMat = new THREE.PointsMaterial({
                    color: 0xffaa44,
                    size: 0.015,
                    transparent: true,
                    opacity: 0.25,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true,
                    map: particleTexture,
                });
                coronaParticles = new THREE.Points(coronaGeo, coronaMat);
                sunGroup.add(coronaParticles);

                // --- CAHAYA MATAHARI ---
                const sunLight = new THREE.PointLight(0xffaa44, 1.5, 0, 0);
                sunLight.position.set(0, 0, 0);
                anchor.group.add(sunLight);

                anchor.group.add(sunGroup);

                // --- TAMPILKAN ---
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // --- ANIMASI LOOP ---
                renderer.setAnimationLoop(() => {
                    const elapsed = clock.getElapsedTime();

                    if (sunGroup) {
                        sunGroup.rotation.y += 0.0015;
                        sunGroup.rotation.x = Math.sin(elapsed * 0.008) * 0.015;

                        if (shaderUniforms) {
                            shaderUniforms.uTime.value = elapsed;
                        }

                        if (coronaParticles) {
                            coronaParticles.rotation.y += 0.0008;
                            coronaParticles.rotation.x += 0.0003;
                        }

                        if (glowSprite) {
                            glowSprite.material.rotation += 0.0003;
                        }
                    }

                    if (stars) stars.rotation.y += 0.00015;

                    renderer.render(scene, camera);
                });

                statusMsg.textContent = 'AR Matahari Realistis Aktif.';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ============================================================
        // 5. STOP AR
        // ============================================================
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            sunGroup = null;
            sunMesh = null;
            coronaParticles = null;
            glowSprite = null;
            stars = null;
            shaderUniforms = null;
            clock = new THREE.Clock();
        }

        // ============================================================
        // 6. EVENT LISTENERS
        // ============================================================
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
