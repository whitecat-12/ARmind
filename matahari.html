<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Matahari — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #0f2027 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1e1b0a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(251, 191, 36, 0.3);
        }

        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">🚀 Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>☀️ Cari gambar target…</span>
        <button id="stopBtn">✕ Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // ─── DOM refs ───────────────────────────────────────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let sunGroup = null;
        let sunLight = null;

        // ─── Fit "contain" untuk video & canvas ───────────────────
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ─── Buat tekstur Matahari procedural yang bagus ──────────
        function createSunTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Gradasi dasar
            const grad = ctx.createRadialGradient(512, 512, 0, 512, 512, 512);
            grad.addColorStop(0, '#fffce0');
            grad.addColorStop(0.2, '#ffe066');
            grad.addColorStop(0.5, '#ffaa00');
            grad.addColorStop(0.8, '#ee7700');
            grad.addColorStop(1, '#cc4400');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            // Pola bintik (granulasi)
            for (let i = 0; i < 8000; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 10 + 1;
                const alpha = Math.random() * 0.3 + 0.05;
                const brightness = Math.random() > 0.5 ? 255 : 180;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${brightness}, ${brightness-40}, 0, ${alpha})`;
                ctx.fill();
            }

            // Flare / lidah api
            for (let i = 0; i < 200; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 0.8 + 0.2;
                const x = 512 + Math.cos(angle) * dist * 512;
                const y = 512 + Math.sin(angle) * dist * 512;
                const w = Math.random() * 60 + 20;
                const h = Math.random() * 20 + 10;
                const alpha = Math.random() * 0.15 + 0.05;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle + Math.random() - 0.5);
                ctx.fillStyle = `rgba(255, 200, 100, ${alpha})`;
                ctx.beginPath();
                ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            return tex;
        }

        // ─── Buat matahari dengan Three.js ─────────────────────────
        function createSun() {
            const group = new THREE.Group();

            // 1. Bola utama dengan tekstur
            const sunTex = createSunTexture();
            const radius = 0.45;
            const geometry = new THREE.SphereGeometry(radius, 80, 80);
            const material = new THREE.MeshStandardMaterial({
                map: sunTex,
                emissive: new THREE.Color(0xff8800),
                emissiveIntensity: 0.9,
                roughness: 0.3,
                metalness: 0.0,
            });
            const mesh = new THREE.Mesh(geometry, material);
            group.add(mesh);

            // 2. Corona / glow dalam (transparan berlapis)
            const coronaMat = new THREE.MeshBasicMaterial({
                color: 0xff6600,
                transparent: true,
                opacity: 0.15,
                side: THREE.BackSide,
            });
            const coronaGeo = new THREE.SphereGeometry(radius * 1.4, 48, 48);
            const corona = new THREE.Mesh(coronaGeo, coronaMat);
            group.add(corona);

            const coronaMat2 = new THREE.MeshBasicMaterial({
                color: 0xffaa44,
                transparent: true,
                opacity: 0.08,
                side: THREE.BackSide,
            });
            const coronaGeo2 = new THREE.SphereGeometry(radius * 1.8, 48, 48);
            const corona2 = new THREE.Mesh(coronaGeo2, coronaMat2);
            group.add(corona2);

            // 3. Partikel api (titik-titik berkilau di sekitar)
            const particleCount = 400;
            const positions = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            for (let i = 0; i < particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = radius * (1.2 + Math.random() * 0.8);
                positions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
                positions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
                positions[i * 3 + 2] = Math.cos(phi) * r;
                sizes[i] = 0.01 + Math.random() * 0.02;
            }
            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            const particleMat = new THREE.PointsMaterial({
                color: 0xffaa44,
                size: 0.025,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            group.add(particles);

            return group;
        }

        // ─── Start AR ──────────────────────────────────────────────
        async function startAR() {
            try {
                statusMsg.textContent = '⏳ Meminta izin kamera…';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/matahari.mind',
                });

                const { renderer, scene, camera } = mindarThree;

                // ─── Pencahayaan lingkungan ────────────────────────
                const ambient = new THREE.AmbientLight(0x404060);
                scene.add(ambient);
                const hemi = new THREE.HemisphereLight(0xffdd88, 0x080820, 0.6);
                scene.add(hemi);

                // ─── Anchor target ─────────────────────────────────
                const anchor = mindarThree.addAnchor(0);

                // ─── Buat Matahari ─────────────────────────────────
                sunGroup = createSun();
                anchor.group.add(sunGroup);

                // ─── Point light dari matahari ─────────────────────
                sunLight = new THREE.PointLight(0xffaa44, 2.5, 0, 0);
                sunLight.position.set(0, 0, 0);
                anchor.group.add(sunLight);

                // ─── Bintang-bintang latar ─────────────────────────
                const starGeo = new THREE.BufferGeometry();
                const starCount = 300;
                const starPos = new Float32Array(starCount * 3);
                const spread = 5;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.008,
                    transparent: true,
                    opacity: 0.7,
                    sizeAttenuation: true,
                });
                const stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.2;
                anchor.group.add(stars);

                // ─── Tampilkan AR ──────────────────────────────────
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // ─── Animasi ──────────────────────────────────────
                renderer.setAnimationLoop(() => {
                    if (sunGroup) {
                        sunGroup.rotation.y += 0.0015;
                        // Partikel api berputar sedikit lebih cepat
                        sunGroup.children.forEach(child => {
                            if (child.isPoints) {
                                child.rotation.y += 0.003;
                                child.rotation.x += 0.001;
                            }
                        });
                    }
                    stars.rotation.y += 0.0002;
                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '✅ AR Matahari aktif!';

            } catch (err) {
                console.error('❌ Error:', err);
                statusMsg.textContent = '❌ Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ─── Stop AR ───────────────────────────────────────────────
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            sunGroup = null;
            sunLight = null;
        }

        // ─── Event listeners ──────────────────────────────────────
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
