<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Matahari — Glowing Max</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #0a0e14 0%, #000000 80%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffe680, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 60px rgba(255, 180, 0, 0.3);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #ffe680, #ff9900);
            color: #1e1b0a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(255, 180, 0, 0.4);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 48px 8px rgba(255, 180, 0, 0.5);
        }

        #statusMsg {
            font-size: 13px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.7), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>☀️ Matahari Menyala</h1>
        <button id="startBtn">Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>Cari target...</span>
        <button id="stopBtn">Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let sunGroup = null;
        let sunMesh = null;
        let coronaParticles = null;
        let glowLayers = [];
        let flareSprite = null;
        let stars = null;
        let shaderUniforms = null;
        let clock = new THREE.Clock();

        // Fit "contain" untuk video & canvas
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;
            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;
            [video, canvas].forEach((el) => {
                el.style.width = w + 'px';
                el.style.height = h + 'px';
                el.style.left = left + 'px';
                el.style.top = top + 'px';
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ============================================================
        // TEKSTUR MATAHARI — SANGAT TERANG
        // ============================================================
        function createHighResSunTexture(width = 2048, height = 2048) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Base gradient — lebih putih/kuning terang
            const grad = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width / 2);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.05, '#fffde0');
            grad.addColorStop(0.2, '#fff4a3');
            grad.addColorStop(0.5, '#fdd835');
            grad.addColorStop(0.75, '#f9a825');
            grad.addColorStop(0.92, '#ef6c00');
            grad.addColorStop(1, '#bf360c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Granulasi — lebih terang
            for (let i = 0; i < 5000; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = 5 + Math.random() * 20;
                const hue = 35 + Math.random() * 20;
                const sat = 60 + Math.random() * 30;
                const lig = 60 + Math.random() * 30;
                const alpha = 0.2 + Math.random() * 0.35;
                const grad2 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad2.addColorStop(0, `hsla(${hue}, ${sat}%, ${lig + 20}%, ${alpha})`);
                grad2.addColorStop(0.7, `hsla(${hue}, ${sat}%, ${lig}%, ${alpha * 0.5})`);
                grad2.addColorStop(1, `hsla(${hue}, ${sat}%, ${lig - 10}%, 0)`);
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Sunspot — lebih sedikit dan lebih terang di tepi
            for (let i = 0; i < 15; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = 20 + Math.random() * 45;
                const grad3 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad3.addColorStop(0, 'rgba(50, 25, 10, 0.7)');
                grad3.addColorStop(0.5, 'rgba(80, 45, 25, 0.5)');
                grad3.addColorStop(0.85, 'rgba(160, 110, 60, 0.2)');
                grad3.addColorStop(1, 'rgba(200, 150, 80, 0)');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Filamen plasma
            ctx.strokeStyle = 'rgba(255, 210, 80, 0.08)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const len = 30 + Math.random() * 100;
                const angle = Math.random() * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
                ctx.stroke();
            }

            // Flare terang
            for (let i = 0; i < 150; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const r = 2 + Math.random() * 10;
                const grad5 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad5.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                grad5.addColorStop(1, 'rgba(255, 220, 80, 0)');
                ctx.fillStyle = grad5;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // ============================================================
        // SHADER PERMUKAAN — EMISI KUAT
        // ============================================================
        const sunVertexShader = `
                uniform float uTime;
                uniform float uNoiseScale;
                uniform float uNoiseStrength;

                varying vec3 vPosition;
                varying vec2 vUv;
                varying float vElevation;
                varying vec3 vNormal;

                float hash(vec3 p) {
                    p  = fract(p * 0.3183099 + .1);
                    p *= 17.0;
                    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }

                float noise(vec3 p) {
                    vec3 i = floor(p);
                    vec3 f = fract(p);
                    f = f*f*(3.0-2.0*f);
                    return mix(mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)), f.x),
                                   mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                               mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                                   mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
                }

                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    float r = length(pos);
                    vec3 dir = normalize(pos);

                    float n = noise(pos * uNoiseScale + uTime * 0.07);
                    float displacement = (n - 0.5) * uNoiseStrength;
                    float n2 = noise(pos * uNoiseScale * 0.5 + uTime * 0.11);
                    displacement += (n2 - 0.5) * uNoiseStrength * 0.4;

                    float latFactor = 1.0 - abs(dir.y) * 0.3;
                    displacement *= latFactor;

                    float newR = r + displacement;
                    pos = dir * newR;

                    vPosition = pos;
                    vElevation = displacement;
                    vNormal = normalize(pos);

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `;

        const sunFragmentShader = `
                uniform vec3 uColor1;
                uniform vec3 uColor2;
                uniform vec3 uColor3;
                uniform float uTime;
                uniform sampler2D uTexture;

                varying vec2 vUv;
                varying vec3 vPosition;
                varying float vElevation;
                varying vec3 vNormal;

                void main() {
                    vec4 texColor = texture2D(uTexture, vUv);

                    float elev = vElevation * 2.0 + 0.5;
                    vec3 elevColor = mix(uColor1, uColor2, elev);
                    elevColor = mix(elevColor, uColor3, max(0.0, elev - 0.6) * 4.0);

                    vec3 finalColor = mix(texColor.rgb, elevColor, 0.5);

                    // Fresnel lebih kuat
                    float fresnel = pow(1.0 - abs(dot(normalize(vNormal), vec3(0.0, 0.0, 1.0))), 2.0);
                    finalColor += vec3(1.0, 0.7, 0.3) * fresnel * 0.4;

                    // Emisi berdenyut
                    float pulse = 0.85 + 0.15 * sin(vUv.x * 30.0 + vUv.y * 25.0 + uTime * 0.8);
                    finalColor *= (0.9 + 0.1 * pulse);

                    // Tambahan glow internal
                    float innerGlow = 0.3 * (1.0 - length(vUv - 0.5) * 1.2);
                    finalColor += vec3(1.0, 0.8, 0.4) * max(0.0, innerGlow);

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `;

        // ============================================================
        // TEKSTUR GLOW — LAPISAN BERTINGKAT
        // ============================================================
        function createGlowTexture(size = 512, falloff = 0.3) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const half = size / 2;
            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(falloff * 0.3, 'rgba(255,240,200,0.9)');
            grad.addColorStop(falloff * 0.7, 'rgba(255,200,100,0.6)');
            grad.addColorStop(falloff * 1.2, 'rgba(255,150,50,0.3)');
            grad.addColorStop(1, 'rgba(255,80,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        function createFlareTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const half = 128;
            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.15, 'rgba(255,220,150,0.9)');
            grad.addColorStop(0.5, 'rgba(255,180,80,0.5)');
            grad.addColorStop(1, 'rgba(255,100,20,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            // Sinar
            ctx.strokeStyle = 'rgba(255,220,150,0.25)';
            ctx.lineWidth = 3;
            for (let i = 0; i < 16; i++) {
                const angle = (i / 16) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(half, half);
                ctx.lineTo(half + Math.cos(angle) * half * 0.95, half + Math.sin(angle) * half * 0.95);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // ============================================================
        // START AR
        // ============================================================
        async function startAR() {
            try {
                statusMsg.textContent = 'Meminta izin kamera...';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/matahari.mind',
                });

                const { renderer, scene, camera } = mindarThree;

                // ⚠️ JANGAN set scene.background — biarkan transparan agar video kamera terlihat!
                // scene.background = new THREE.Color(0x000000); // <-- HAPUS ini!

                // Ambient redup — biarkan kamera tetap terang
                const ambient = new THREE.AmbientLight(0x333355, 0.3);
                scene.add(ambient);

                // Light directional untuk efek 3D
                const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
                dirLight.position.set(1, 1, 1);
                scene.add(dirLight);

                const anchor = mindarThree.addAnchor(0);

                // === BINTANG ===
                const starGeo = new THREE.BufferGeometry();
                const starCount = 500;
                const starPos = new Float32Array(starCount * 3);
                const spread = 7.0;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.012,
                    transparent: true,
                    opacity: 0.7,
                    sizeAttenuation: true,
                });
                stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.3;
                anchor.group.add(stars);

                // === MATAHARI ===
                const sunRadius = 0.5;

                statusMsg.textContent = 'Membuat tekstur...';
                const sunTexture = createHighResSunTexture(2048, 2048);

                shaderUniforms = {
                    uTime: { value: 0 },
                    uNoiseScale: { value: 3.8 },
                    uNoiseStrength: { value: 0.06 },
                    uColor1: { value: new THREE.Color(0xfff0aa) },
                    uColor2: { value: new THREE.Color(0xffaa44) },
                    uColor3: { value: new THREE.Color(0xff5500) },
                    uTexture: { value: sunTexture },
                };

                const sunMaterial = new THREE.ShaderMaterial({
                    vertexShader: sunVertexShader,
                    fragmentShader: sunFragmentShader,
                    uniforms: shaderUniforms,
                    side: THREE.FrontSide,
                });

                const geometry = new THREE.SphereGeometry(sunRadius, 96, 96);
                sunMesh = new THREE.Mesh(geometry, sunMaterial);
                sunGroup = new THREE.Group();
                sunGroup.add(sunMesh);

                // === GLOW LAPISAN 1 — Dalam (sangat terang) ===
                const glowTex1 = createGlowTexture(512, 0.25);
                const glowMat1 = new THREE.SpriteMaterial({
                    map: glowTex1,
                    color: 0xffdd77,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    opacity: 0.9,
                });
                const glow1 = new THREE.Sprite(glowMat1);
                glow1.scale.set(sunRadius * 3.5, sunRadius * 3.5, 1);
                sunGroup.add(glow1);
                glowLayers.push(glow1);

                // === GLOW LAPISAN 2 — Medium ===
                const glowTex2 = createGlowTexture(512, 0.5);
                const glowMat2 = new THREE.SpriteMaterial({
                    map: glowTex2,
                    color: 0xffaa44,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    opacity: 0.6,
                });
                const glow2 = new THREE.Sprite(glowMat2);
                glow2.scale.set(sunRadius * 6.0, sunRadius * 6.0, 1);
                sunGroup.add(glow2);
                glowLayers.push(glow2);

                // === GLOW LAPISAN 3 — Luar (soft) ===
                const glowTex3 = createGlowTexture(512, 0.8);
                const glowMat3 = new THREE.SpriteMaterial({
                    map: glowTex3,
                    color: 0xff8833,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    opacity: 0.3,
                });
                const glow3 = new THREE.Sprite(glowMat3);
                glow3.scale.set(sunRadius * 10.0, sunRadius * 10.0, 1);
                sunGroup.add(glow3);
                glowLayers.push(glow3);

                // === FLARE ===
                const flareTex = createFlareTexture();
                const flareMat = new THREE.SpriteMaterial({
                    map: flareTex,
                    color: 0xffcc66,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    opacity: 0.5,
                });
                flareSprite = new THREE.Sprite(flareMat);
                flareSprite.scale.set(sunRadius * 4.0, sunRadius * 4.0, 1);
                sunGroup.add(flareSprite);

                // === PARTIKEL KORONA — lebih banyak & lebih terang ===
                const coronaCount = 2000;
                const coronaPositions = new Float32Array(coronaCount * 3);
                const coronaSizes = new Float32Array(coronaCount);
                const coronaSpeeds = new Float32Array(coronaCount);
                const coronaOffsets = new Float32Array(coronaCount);
                for (let i = 0; i < coronaCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const radius = sunRadius * (1.05 + Math.random() * 1.6);
                    coronaPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    coronaPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    coronaPositions[i * 3 + 2] = radius * Math.cos(phi);
                    coronaSizes[i] = 0.015 + Math.random() * 0.035;
                    coronaSpeeds[i] = 0.15 + Math.random() * 0.6;
                    coronaOffsets[i] = Math.random() * 100;
                }
                const coronaGeo = new THREE.BufferGeometry();
                coronaGeo.setAttribute('position', new THREE.BufferAttribute(coronaPositions, 3));
                coronaGeo.setAttribute('size', new THREE.BufferAttribute(coronaSizes, 1));

                // Texture partikel bulat
                const partTexCanvas = document.createElement('canvas');
                partTexCanvas.width = 64;
                partTexCanvas.height = 64;
                const pctx = partTexCanvas.getContext('2d');
                const pgrd = pctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                pgrd.addColorStop(0, 'rgba(255,255,255,1)');
                pgrd.addColorStop(0.3, 'rgba(255,220,150,0.8)');
                pgrd.addColorStop(1, 'rgba(255,150,50,0)');
                pctx.fillStyle = pgrd;
                pctx.fillRect(0, 0, 64, 64);
                const partTex = new THREE.CanvasTexture(partTexCanvas);

                const coronaMat = new THREE.PointsMaterial({
                    color: 0xffaa44,
                    size: 0.035,
                    transparent: true,
                    opacity: 0.55,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true,
                    map: partTex,
                    depthWrite: false,
                });
                coronaParticles = new THREE.Points(coronaGeo, coronaMat);
                coronaParticles.userData = { speeds: coronaSpeeds, offsets: coronaOffsets };
                sunGroup.add(coronaParticles);

                // === CAHAYA TITIK — lebih kuat ===
                const light1 = new THREE.PointLight(0xffaa44, 8.0, 0, 0);
                light1.position.set(0, 0, 0);
                anchor.group.add(light1);

                const light2 = new THREE.PointLight(0xff8833, 4.0, 0, 0);
                light2.position.set(0.4, 0.4, 0.4);
                anchor.group.add(light2);

                const light3 = new THREE.PointLight(0xff6600, 3.0, 0, 0);
                light3.position.set(-0.3, -0.3, 0.3);
                anchor.group.add(light3);

                anchor.group.add(sunGroup);

                // === TAMPILKAN ===
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // === ANIMASI ===
                renderer.setAnimationLoop(() => {
                    const elapsed = clock.getElapsedTime();

                    if (sunGroup) {
                        sunGroup.rotation.y += 0.0015;
                        sunGroup.rotation.x = Math.sin(elapsed * 0.008) * 0.015;

                        if (shaderUniforms) {
                            shaderUniforms.uTime.value = elapsed;
                        }

                        // Partikel korona — rotasi dan pulsasi
                        if (coronaParticles) {
                            coronaParticles.rotation.y += 0.0012;
                            coronaParticles.rotation.x += 0.0004;
                            const pulse = 0.85 + 0.15 * Math.sin(elapsed * 0.3);
                            coronaParticles.material.size = 0.035 * pulse;
                            coronaParticles.material.opacity = 0.45 + 0.15 * Math.sin(elapsed * 0.2 + 1.0);
                        }

                        // Glow layers — rotasi dan denyut
                        glowLayers.forEach((g, idx) => {
                            g.material.rotation += 0.0003 * (idx + 1);
                            const pulse = 0.92 + 0.08 * Math.sin(elapsed * 0.25 + idx * 0.7);
                            const baseScale = [3.5, 6.0, 10.0][idx] || 3.5;
                            const s = baseScale * pulse;
                            g.scale.set(sunRadius * s, sunRadius * s, 1);
                        });

                        if (flareSprite) {
                            flareSprite.material.rotation += 0.0006;
                            const fp = 0.9 + 0.1 * Math.sin(elapsed * 0.15 + 0.5);
                            const fs = 4.0 * fp;
                            flareSprite.scale.set(sunRadius * fs, sunRadius * fs, 1);
                            flareSprite.material.opacity = 0.4 + 0.15 * Math.sin(elapsed * 0.2);
                        }
                    }

                    if (stars) stars.rotation.y += 0.00015;

                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '☀️ Matahari Menyala!';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Gagal akses kamera. Pastikan HTTPS / localhost.';
            }
        }

        // ============================================================
        // STOP AR
        // ============================================================
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try { await mindarThree.stop(); } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            sunGroup = null;
            sunMesh = null;
            coronaParticles = null;
            glowLayers = [];
            flareSprite = null;
            stars = null;
            shaderUniforms = null;
            clock = new THREE.Clock();
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
