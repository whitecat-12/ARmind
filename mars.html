<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Mars — MindAR + Three.js</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
            overflow: hidden;
        }
        #container video,
        #container canvas {
            position: absolute;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 32px;
            background: radial-gradient(circle at 50% 30%, #1a1a24 0%, #0b0f14 70%);
            color: #e7f6f8;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 40px rgba(220, 38, 38, 0.15);
        }
        #startBtn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #1a1a1a;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.3);
        }
        #startBtn:active {
            transform: scale(0.96);
        }
        #startBtn:hover {
            box-shadow: 0 0 32px 4px rgba(220, 38, 38, 0.3);
        }

        #statusMsg {
            font-size: 12px;
            color: #6f8890;
            min-height: 20px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 20px;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }
        #hud span {
            color: #fff;
            font-size: 13px;
            opacity: 0.85;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        }
        #stopBtn {
            pointer-events: auto;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        #stopBtn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            #overlay h1 {
                font-size: 32px;
            }
            #startBtn {
                padding: 12px 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Start the adventure</h1>
        <button id="startBtn">🚀 Mulai AR</button>
        <p id="statusMsg"></p>
    </div>

    <div id="hud">
        <span>♂️ Cari gambar target…</span>
        <button id="stopBtn">✕ Stop</button>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        // ─── DOM refs ───────────────────────────────────────────────
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const container = document.getElementById('container');
        const statusMsg = document.getElementById('statusMsg');

        let mindarThree = null;
        let fitRAF = null;
        let planetGroup = null;
        let planetMesh = null;
        let stars = null;

        // ─── Fit "contain" untuk video & canvas ───────────────────
        function applyContainFit() {
            const video = container.querySelector('video');
            const canvas = container.querySelector('canvas');
            if (!video || !canvas || !video.videoWidth) return false;

            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = cw / ch;

            let w, h;
            if (videoRatio > containerRatio) {
                w = cw;
                h = cw / videoRatio;
            } else {
                h = ch;
                w = ch * videoRatio;
            }
            const left = (cw - w) / 2;
            const top = (ch - h) / 2;

            [video, canvas].forEach((el) => {
                el.style.width = `${w}px`;
                el.style.height = `${h}px`;
                el.style.left = `${left}px`;
                el.style.top = `${top}px`;
            });
            return true;
        }

        function waitAndFit() {
            if (!applyContainFit()) {
                fitRAF = requestAnimationFrame(waitAndFit);
            }
        }

        function onWindowResize() {
            applyContainFit();
        }

        // ─── Buat tekstur Mars (procedural) ──────────────────────
        function createMarsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // 1. Warna dasar merah-kecoklatan
            const grad = ctx.createRadialGradient(512, 512, 0, 512, 512, 512);
            grad.addColorStop(0, '#e08e6a');
            grad.addColorStop(0.3, '#c4713c');
            grad.addColorStop(0.6, '#a85a2a');
            grad.addColorStop(0.85, '#8a4a1a');
            grad.addColorStop(1, '#5c2e0e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            // 2. Variasi warna (bintik-bintik)
            for (let i = 0; i < 8000; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 6 + 1;
                const brightness = 100 + Math.random() * 120;
                const hue = 10 + Math.random() * 20;
                const alpha = Math.random() * 0.3 + 0.05;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 70%, ${brightness-30}%, ${alpha})`;
                ctx.fill();
            }

            // 3. Kawah-kawah besar
            const craters = [
                { x: 200, y: 300, r: 60, depth: 0.6 },
                { x: 700, y: 200, r: 45, depth: 0.5 },
                { x: 500, y: 600, r: 80, depth: 0.7 },
                { x: 150, y: 750, r: 35, depth: 0.4 },
                { x: 800, y: 650, r: 50, depth: 0.5 },
                { x: 350, y: 150, r: 40, depth: 0.4 },
                { x: 900, y: 400, r: 55, depth: 0.6 },
                { x: 100, y: 450, r: 30, depth: 0.3 },
                { x: 600, y: 850, r: 70, depth: 0.6 },
                { x: 400, y: 400, r: 25, depth: 0.3 },
                { x: 750, y: 100, r: 38, depth: 0.4 },
                { x: 300, y: 900, r: 42, depth: 0.5 },
                { x: 850, y: 800, r: 48, depth: 0.5 },
                { x: 550, y: 350, r: 32, depth: 0.3 },
                { x: 150, y: 150, r: 28, depth: 0.3 },
                { x: 450, y: 200, r: 20, depth: 0.2 },
                { x: 700, y: 500, r: 65, depth: 0.6 },
                { x: 250, y: 650, r: 45, depth: 0.4 },
            ];

            craters.forEach((c) => {
                // Shadow (bagian gelap)
                const shadowGrad = ctx.createRadialGradient(
                    c.x - c.r * 0.2, c.y - c.r * 0.2, 0,
                    c.x, c.y, c.r
                );
                shadowGrad.addColorStop(0, `rgba(0,0,0,${0.4 * c.depth})`);
                shadowGrad.addColorStop(0.6, `rgba(0,0,0,${0.6 * c.depth})`);
                shadowGrad.addColorStop(1, `rgba(0,0,0,0)`);
                ctx.fillStyle = shadowGrad;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();

                // Highlight (bagian terang di sisi lain)
                const hlGrad = ctx.createRadialGradient(
                    c.x + c.r * 0.3, c.y + c.r * 0.3, 0,
                    c.x, c.y, c.r * 0.8
                );
                hlGrad.addColorStop(0, `rgba(255,200,150,${0.2 * c.depth})`);
                hlGrad.addColorStop(1, `rgba(255,200,150,0)`);
                ctx.fillStyle = hlGrad;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();

                // Lingkaran tepi kawah
                ctx.strokeStyle = `rgba(60,30,10,${0.3 * c.depth})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r * 0.9, 0, Math.PI * 2);
                ctx.stroke();
            });

            // 4. Kawah-kawah kecil
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 10 + 2;
                const depth = Math.random() * 0.5 + 0.2;
                const grad2 = ctx.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r);
                grad2.addColorStop(0, `rgba(0,0,0,${0.25 * depth})`);
                grad2.addColorStop(0.7, `rgba(0,0,0,${0.35 * depth})`);
                grad2.addColorStop(1, `rgba(0,0,0,0)`);
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // 5. Retakan / lembah (Valles Marineris style)
            ctx.strokeStyle = 'rgba(40,20,5,0.25)';
            ctx.lineWidth = 3;
            for (let i = 0; i < 40; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const len = Math.random() * 100 + 30;
                const angle = Math.random() * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                let steps = 30;
                for (let j = 0; j <= steps; j++) {
                    const t = j / steps;
                    const px = x + Math.cos(angle) * len * t + Math.sin(angle * 0.3) * t * 20;
                    const py = y + Math.sin(angle) * len * t + Math.cos(angle * 0.3) * t * 20;
                    ctx.lineTo(px, py);
                }
                ctx.stroke();
            }

            // 6. Daerah terang (kutub / debu)
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const r = Math.random() * 20 + 5;
                const grad2 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad2.addColorStop(0, 'rgba(220, 200, 170, 0.1)');
                grad2.addColorStop(1, 'rgba(220, 200, 170, 0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            return tex;
        }

        // ─── Start AR ──────────────────────────────────────────────
        async function startAR() {
            try {
                statusMsg.textContent = '⏳ Meminta izin kamera…';

                mindarThree = new MindARThree({
                    container,
                    imageTargetSrc: 'targets/mars.mind', // ← file target Mars
                });

                const { renderer, scene, camera } = mindarThree;

                // ─── Pencahayaan ───────────────────────────────────
                const ambient = new THREE.AmbientLight(0x404060, 0.6);
                scene.add(ambient);

                const hemiLight = new THREE.HemisphereLight(0xffcc88, 0x332211, 0.8);
                scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
                dirLight.position.set(2, 3, 2);
                scene.add(dirLight);

                const fillLight = new THREE.DirectionalLight(0xcc8866, 0.5);
                fillLight.position.set(-2, 0.5, -1);
                scene.add(fillLight);

                // ─── Anchor target ─────────────────────────────────
                const anchor = mindarThree.addAnchor(0);

                // ─── Buat Mars ─────────────────────────────────────
                const planetRadius = 0.3;
                const texture = createMarsTexture();

                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.8,
                    metalness: 0.05,
                });

                const geometry = new THREE.SphereGeometry(planetRadius, 64, 64);
                planetMesh = new THREE.Mesh(geometry, material);
                planetGroup = new THREE.Group();
                planetGroup.add(planetMesh);

                // ─── Atmosfer tipis (glow merah) ──────────────────
                const atmosMat = new THREE.MeshBasicMaterial({
                    color: 0xcc4422,
                    transparent: true,
                    opacity: 0.06,
                    side: THREE.BackSide,
                });
                const atmosGeo = new THREE.SphereGeometry(planetRadius * 1.08, 48, 48);
                const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
                planetGroup.add(atmosMesh);

                anchor.group.add(planetGroup);

                // ─── Bintang-bintang latar ─────────────────────────
                const starGeo = new THREE.BufferGeometry();
                const starCount = 400;
                const starPos = new Float32Array(starCount * 3);
                const spread = 6.0;
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * spread;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.008,
                    transparent: true,
                    opacity: 0.7,
                    sizeAttenuation: true,
                });
                stars = new THREE.Points(starGeo, starMat);
                stars.position.y = 0.2;
                anchor.group.add(stars);

                // ─── Tampilkan AR ──────────────────────────────────
                overlay.style.display = 'none';
                container.style.display = 'block';
                hud.style.display = 'flex';

                await mindarThree.start();

                waitAndFit();
                window.addEventListener('resize', onWindowResize);

                // ─── Animasi Loop ──────────────────────────────────
                renderer.setAnimationLoop(() => {
                    // Rotasi Mars
                    if (planetGroup) {
                        planetGroup.rotation.y += 0.002;
                    }

                    // Bintang berputar pelan
                    if (stars) stars.rotation.y += 0.0001;

                    renderer.render(scene, camera);
                });

                statusMsg.textContent = '✅ AR Mars aktif!';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = '❌ Gagal mengakses kamera. Pastikan pakai HTTPS atau localhost, dan izin kamera diberikan.';
            }
        }

        // ─── Stop AR ───────────────────────────────────────────────
        async function stopAR() {
            window.removeEventListener('resize', onWindowResize);
            if (fitRAF) cancelAnimationFrame(fitRAF);
            if (mindarThree) {
                try {
                    await mindarThree.stop();
                } catch (_) {}
                mindarThree.renderer.setAnimationLoop(null);
            }
            container.style.display = 'none';
            hud.style.display = 'none';
            overlay.style.display = 'flex';
            statusMsg.textContent = '';
            planetGroup = null;
            planetMesh = null;
            stars = null;
        }

        // ─── Event listeners ──────────────────────────────────────
        startBtn.addEventListener('click', startAR);
        stopBtn.addEventListener('click', stopAR);
    </script>
</body>
</html>
